COMMENT: Help Section

TEXT: help_essay_about_title|About Essays|About Essays
TEXT: help_essay_about|About Essays|Essays provides explicit booking, in-Chisimba writing with automatic draft saving, optional document upload, submission and marking.

TEXT: help_essay_title_view|Booking an essay|Booking an essay
TEXT: help_essay_overview_view|Help for booking an essay|Choose Book this essay beside the essay you want. Choose Go to booked essay to begin or continue your work. Choose Release booking only if you want to give it up. An unavailable essay has already been booked where exclusive booking is enabled.

TEXT: help_essay_title_viewessays|Viewing booked and submitted essays|Viewing booked and submitted essays
TEXT: help_essay_overview_viewessays|Help for viewing booked and submitted essays|My Essays shows the current state of every booked essay. Choose Write essay or Continue writing to work in Chisimba, or Upload document instead. Drafts save automatically; submission remains a separate deliberate action.

TEXT: help_essay_title_upload|Uploading an essay|Uploading an essay
TEXT: help_essay_overview_upload|Help for uploading an essay|Find the essay using the browse button. Click upload to submit the essay and exit to return to the list of booked essays.

