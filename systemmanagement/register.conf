TEXT: mod_systemmanagement_email_window_help|Maintenance email email_window_help|Email uses the saved start and end when both are present. Otherwise it is labelled Unplanned maintenance. Dates are optional; sending email does not change site availability.
TEXT: mod_systemmanagement_email_queue_help|Maintenance email email_queue_help|Communications queues one private message per recipient and records delivery progress below. A queued message has not yet been confirmed delivered.
TEXT: mod_systemmanagement_email_session_expired|Maintenance email email_session_expired|This submission did not queue an email because your session expired. Your draft is kept below. Please try again.
TEXT: mod_systemmanagement_email_required|Maintenance email email_required|This submission did not queue an email. Choose an audience and enter a subject and message. Your draft is kept below.
TEXT: mod_systemmanagement_email_too_long|Maintenance email email_too_long|This submission did not queue an email. Use at most 255 characters for the subject and 10,000 for the message. Your draft is kept below.
TEXT: mod_systemmanagement_email_queued|Maintenance email email_queued|Maintenance emails queued: {count}. Delivery is not yet confirmed; check the delivery history below. Your message remains below for reference.
TEXT: mod_systemmanagement_email_not_queued|Maintenance email email_not_queued|No maintenance email was queued by this submission. {reason} Your draft is kept below.
TEXT: mod_systemmanagement_email_incomplete|Maintenance email email_incomplete|Queueing did not complete. Confirmed queued: {count} of {total}. Some messages may already be queued or delivered. Your draft is kept below. Check the delivery history before retrying to avoid duplicate messages.
TEXT: mod_systemmanagement_email_unknown|Maintenance email email_unknown|The queueing outcome could not be confirmed. Your draft is kept below. Check the delivery history before retrying to avoid duplicate messages.
TEXT: mod_systemmanagement_email_no_recipients|Maintenance email email_no_recipients|No active users with valid email addresses match that audience.
TEXT: mod_systemmanagement_email_queue_failed|Maintenance email email_queue_failed|Communications could not queue the message.

TEXT: mod_systemmanagement_noaccess|Maintenance access restriction|System Maintenance is available only to site administrators.
TEXT: mod_systemmanagement_runbook_link|Deployment guide link|Deployment runbook for operators and coding agents
TEXT: mod_systemmanagement_help_maintenance_title|System Maintenance help maintenance title|Plan maintenance and update the site
TEXT: mod_systemmanagement_help_maintenance_summary|System Maintenance help maintenance summary|Use System Maintenance to announce an interruption, control public access and return the site to service. Saving dates or sending an email never changes site availability automatically.
TEXT: mod_systemmanagement_help_maintenance_step_1|System Maintenance help maintenance step_1|Prepare first. Agree the exact changes, test them locally, and give the person deploying a start and end time in the site time zone. Keep an administrator session open.
TEXT: mod_systemmanagement_help_maintenance_step_2|System Maintenance help maintenance step_2|Enter an Offline message and, for planned work, a Planned start and Planned end. Select Save plan. Check the saved times before sending your announcement.
TEXT: mod_systemmanagement_help_maintenance_step_3|System Maintenance help maintenance step_3|Choose the email audience, enter a subject and message, and select Queue email notice once. Read the result and check Maintenance email delivery. A queued message is waiting for the worker; sent means the provider accepted it, not proof that it reached an inbox.
TEXT: mod_systemmanagement_help_maintenance_step_4|System Maintenance help maintenance step_4|At the agreed start, select Take site offline. Confirm the status says Offline for non-administrators. Administrators can still work. The saved start time will not press this button for you.
TEXT: mod_systemmanagement_help_maintenance_step_5|System Maintenance help maintenance step_5|Have the operator take and verify backups, deploy only the agreed changes, apply the necessary module updates and check the changed features while the site remains offline. The Deployment runbook below gives the technical procedure.
TEXT: mod_systemmanagement_help_maintenance_step_6|System Maintenance help maintenance step_6|When the checks pass, select Bring site online. Check the public home page and a course page without an administrator session. Record what changed, the result and the backup location.
TEXT: mod_systemmanagement_help_maintenance_heading_1|System Maintenance help maintenance heading_1|Emergency maintenance
TEXT: mod_systemmanagement_help_maintenance_body_1|System Maintenance help maintenance body_1|For urgent work, you can take the site offline immediately and send an announcement without planned dates. Save the offline message with both date fields empty to clear an old plan. When either saved date is absent the email says Unplanned maintenance; a complete saved pair is quoted instead. Sending the announcement does not take the site offline or reopen it.
TEXT: mod_systemmanagement_help_maintenance_heading_2|System Maintenance help maintenance heading_2|If an email submission fails
TEXT: mod_systemmanagement_help_maintenance_body_2|System Maintenance help maintenance body_2|The audience, subject and message remain on the page after a handled submission error. No email queued means that submission queued nothing. A partial or uncertain result may have queued some messages: inspect the delivery history before trying again. The draft also remains after success for reference; pressing Queue email notice again creates a new send. This is not a permanent saved draft, so copy it before navigating away.
TEXT: mod_systemmanagement_help_maintenance_heading_3|System Maintenance help maintenance heading_3|Sender name and delivery
TEXT: mod_systemmanagement_help_maintenance_body_3|System Maintenance help maintenance body_3|New emails use the configured site name by default. A deliberate custom sender name in Communications takes precedence. The verified sender email address is configured separately. Changing the name does not change mail already queued or sent. The application can confirm queueing and provider acceptance, but does not establish inbox delivery or that a person read the message.
TEXT: mod_systemmanagement_help_maintenance_heading_4|System Maintenance help maintenance heading_4|If the update cannot be completed
TEXT: mod_systemmanagement_help_maintenance_body_4|System Maintenance help maintenance body_4|Keep public access off while the operator diagnoses or restores the previous release. Do not repeatedly retry a failing deployment. If the announced end time is approaching, arrange a revised window and communicate the change. Reopen only after the necessary checks pass.
TEXT: mod_systemmanagement_help_maintenance_heading_5|System Maintenance help maintenance heading_5|Working with a coding agent
TEXT: mod_systemmanagement_help_maintenance_body_5|System Maintenance help maintenance body_5|Give the agent the target site, the agreed changes and the maintenance window. Tell it who will take the site offline and who will reopen it. It should report preparation, deployment and verification separately. A timer is a reminder to recheck the window and site state; it is not permission to deploy a second time.
TEXT: mod_systemmanagement_help_maintenance_heading_6|System Maintenance help maintenance heading_6|Worked example
TEXT: mod_systemmanagement_help_maintenance_body_6|System Maintenance help maintenance body_6|On 9 September 2026, KengaLearn announced 13:30–13:45 South African time. The operator preserved the production release, deployed the Knowledge Map and maintenance-email fixes plus the membership layout correction, checked existing-map checksums, and reopened at about 13:34. The disposable test map was removed. Use this as a sequence, not as a reusable date or release identifier.
TEXT: mod_systemmanagement_help_deployment_runbook_title|System Maintenance help deployment_runbook title|Deployment runbook for operators and coding agents
TEXT: mod_systemmanagement_help_deployment_runbook_summary|System Maintenance help deployment_runbook summary|Follow this procedure for a bounded update to an existing site. Use current evidence and the authorised scope; never substitute a local development database for production data.
TEXT: mod_systemmanagement_help_deployment_runbook_step_1|System Maintenance help deployment_runbook step_1|Establish the release boundary. Read the project Constitution and current deployment record. Record the target hostname, active release, framework and module identities, runtime, installed versions, agreed changes and saved maintenance window. Confirm who owns deployment and reopening; only one operator or task should execute it.
TEXT: mod_systemmanagement_help_deployment_runbook_step_2|System Maintenance help deployment_runbook step_2|Reconcile the sources. Preserve unrelated local work, fetch the relevant remotes, inspect the differences against the deployed baseline, and commit and publish the approved changes. Run focused syntax, behaviour and browser checks using development data. Record meaningful limitations rather than claiming untested behaviour passed.
TEXT: mod_systemmanagement_help_deployment_runbook_step_3|System Maintenance help deployment_runbook step_3|Build a reviewable candidate. For a full release, assemble complete clean Git snapshots. For a bounded release, copy the verified current production release into a new immutable directory and replace only the named modules or exact reviewed patches. Hash inputs and record the baseline plus every overlay. Do not deploy all pending main-branch changes accidentally.
TEXT: mod_systemmanagement_help_deployment_runbook_step_4|System Maintenance help deployment_runbook step_4|Before switching, verify the current release and input hashes again. Check the actual time and saved window, and confirm maintenance is active. Save a database backup and persistent-file backups; verify that each archive can be read and record checksums. Capture before-state evidence for the affected existing data.
TEXT: mod_systemmanagement_help_deployment_runbook_step_5|System Maintenance help deployment_runbook step_5|Test the candidate against the production runtime before it becomes current. Switch the release pointer atomically and restart only the required service. Wait for health checks, then use the canonical module catalogue to update only the affected modules and their required dependencies. Check installed versions and language entries.
TEXT: mod_systemmanagement_help_deployment_runbook_step_6|System Maintenance help deployment_runbook step_6|Verify the changed journeys while maintenance stays on. Inspect existing data read-only and compare the before/after evidence. Use a disposable personal item for a save/reload check when needed, remove only that test item, and compare again. Test mail payloads with a fake queue; do not send real mail without explicit authority.
TEXT: mod_systemmanagement_help_deployment_runbook_step_7|System Maintenance help deployment_runbook step_7|Reopen through System Maintenance only after checks pass. Confirm anonymous home, login and relevant course access, service health and recent errors. Keep verified backups and a usable previous release. Remove temporary helpers, stop any fallback timer and record source identities, times, checks, data comparisons and remaining limitations.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_1|System Maintenance help deployment_runbook heading_1|Hard release gates
TEXT: mod_systemmanagement_help_deployment_runbook_body_1|System Maintenance help deployment_runbook body_1|Stop before changing production if the target, active baseline, archive hash or agreed scope differs from the prepared release. Do not start outside the authorised window. If there is not enough time for backup, deployment, verification and rollback, report that and arrange another window. Existing authorisation remains valid for the agreed actions; do not invent additional approval steps.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_2|System Maintenance help deployment_runbook heading_2|Maintenance is an application control
TEXT: mod_systemmanagement_help_deployment_runbook_body_2|System Maintenance help deployment_runbook body_2|The public-offline switch blocks non-administrators through the application; it is not a database lock. For changes affected by background workers, uploads or external integrations, identify and pause the relevant writers during the critical step and resume them deliberately. Keep administrator access and a rollback route available.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_3|System Maintenance help deployment_runbook heading_3|Protect the data
TEXT: mod_systemmanagement_help_deployment_runbook_body_3|System Maintenance help deployment_runbook body_3|Keep configuration, secrets, uploads, user images, sessions and the production database outside code replacement. Do not import, reseed, rewrite maps or update courses just to deploy source. Checksum comparisons can prove unchanged tables only when no legitimate writes occur during the comparison; account for expected activity and distinguish it from deployment changes.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_4|System Maintenance help deployment_runbook heading_4|Rollback
TEXT: mod_systemmanagement_help_deployment_runbook_body_4|System Maintenance help deployment_runbook body_4|On failed candidate tests, do not switch. On a failed post-switch check, restore the recorded previous release pointer and restart the affected service while public maintenance remains on. Keep the failed release evidence and verified backup. Code rollback does not undo schema or data changes; plan reversible migrations in advance. Never automatically restore an entire database over legitimate intervening work.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_5|System Maintenance help deployment_runbook heading_5|Catalogue updates
TEXT: mod_systemmanagement_help_deployment_runbook_body_5|System Maintenance help deployment_runbook body_5|Use the module catalogue patch service or the normal protected administration forms. Avoid Apply all updates for a bounded release. Language text and menu names can need a catalogue update even when no schema changes. Inspect migration and default-data files before running the update; confirm the exact installed versions afterwards.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_6|System Maintenance help deployment_runbook heading_6|KengaLearn reference paths
TEXT: mod_systemmanagement_help_deployment_runbook_body_6|System Maintenance help deployment_runbook body_6|The server is reached as derek@104.248.35.30. Code is selected by /srv/kengalearn/app/current; releases live under /srv/kengalearn/releases and backups under /srv/kengalearn/backups. Shared configuration and files live under /srv/kengalearn/shared. Verify these paths against the current host before use. Read credentials in place and never print them or copy them into reports.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_7|System Maintenance help deployment_runbook heading_7|Repository references
TEXT: mod_systemmanagement_help_deployment_runbook_body_7|System Maintenance help deployment_runbook body_7|The workspace uses separate framework, modules, canvases and shellscripts repositories under /run/media/derek/main/chisimba-revival. Read shellscripts/kenga-learn-deployment/README.md and the latest release record. The 9 September example is release-preparation-20260909.md with deploy-task-fixes-20260909.sh and manage-task-fixes-20260909.php. Those scripts have fixed dates, hashes and release identities; prepare and review a fresh script instead of rerunning them unchanged.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_8|System Maintenance help deployment_runbook heading_8|Reliable execution and reporting
TEXT: mod_systemmanagement_help_deployment_runbook_body_8|System Maintenance help deployment_runbook body_8|Use strict shell error handling, bounded waits, explicit exit checks and a rollback trap. Keep secrets out of diagnostics; append operational evidence to workspace killme.txt and write a durable release record. A script reaching its last line is insufficient: verify the active release, module versions, data preservation and real page behaviour. Mark the record complete and disable scheduled follow-ups so they cannot redeploy.
TEXT: mod_systemmanagement_help_deployment_runbook_heading_9|System Maintenance help deployment_runbook heading_9|Release acceptance record
TEXT: mod_systemmanagement_help_deployment_runbook_body_9|System Maintenance help deployment_runbook body_9|Verify configuration changes with a fresh process or database read: the existing configuration object can retain an old cached value after saving. Record exactly which changes are local only, published, deployed and verified. Include the source commits or module trees, archive and patch hashes, previous and new release, backup path, timestamps and time zone, tests, temporary-data cleanup and any unverified features. A human should be able to locate the rollback target and understand the result without reading a chat history.
