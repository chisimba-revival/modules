MODULE_AUTHORS: Derek Keats
MODULE_RELEASEDATE: 2026 09 09
MODULE_VERSION: 0.4
UPDATE_DESCRIPTION: Allow unplanned maintenance email, retain submitted drafts and report queue outcomes clearly.
MODULE_STATUS: alpha
MODULE_PATH: systemmanagement
MODULE_ISADMIN: 1
MODULE_ISVISIBLE: 1
MODULE_HASADMINPAGE: 1
CONTEXT_AWARE: 0
DEPENDS_CONTEXT: 0
DEPENDS: security
DEPENDS: sysconfig
DEPENDS: ui
DEPENDS: timeanddate-service
DEPENDS: communications
DEPENDS: config

PAGE: admin_site||server-cog|mod_systemmanagement_title|site
CONDITION: isAdmin|isAdmin
RULE: save,setmaintenance,sendmaintenanceemail,deletenotice|isAdmin

TABLE: tbl_systemmanagement_notices

CONFIG: MAINTENANCE_ENABLED|0|mod_systemmanagement_maintenance_enabled
CONFIG: MAINTENANCE_MESSAGE|Scheduled maintenance is in progress. Please try again shortly.|mod_systemmanagement_maintenance_message
CONFIG: MAINTENANCE_START_AT||mod_systemmanagement_maintenance_start
CONFIG: MAINTENANCE_END_AT||mod_systemmanagement_maintenance_end

TEXT: mod_systemmanagement_title|System management title|System management
TEXT: mod_systemmanagement_maintenance_enabled|Maintenance enabled|Manual maintenance state for non-administrators
TEXT: mod_systemmanagement_maintenance_message|Maintenance message|Message shown while the site is offline
TEXT: mod_systemmanagement_maintenance_start|Planned maintenance start|Optional advisory UTC start time
TEXT: mod_systemmanagement_maintenance_end|Planned maintenance end|Optional advisory UTC end time
TEXT: mod_systemmanagement_email_subject|Maintenance email email_subject|Maintenance notice
TEXT: mod_systemmanagement_email_unplanned|Maintenance email email_unplanned|Unplanned maintenance
TEXT: mod_systemmanagement_email_planned_window|Maintenance email email_planned_window|Planned maintenance window:
TEXT: mod_systemmanagement_email_start|Maintenance email email_start|Start
TEXT: mod_systemmanagement_email_end|Maintenance email email_end|End
TEXT: mod_systemmanagement_email_window_help|Maintenance email email_window_help|Email uses the saved start and end when both are present. Otherwise it is labelled Unplanned maintenance. Dates are optional; sending email does not change site availability.
TEXT: mod_systemmanagement_email_queue_help|Maintenance email email_queue_help|Communications queues one private message per recipient and records delivery progress below. A queued message has not yet been confirmed delivered.
TEXT: mod_systemmanagement_email_session_expired|Maintenance email email_session_expired|This submission did not queue an email because your session expired. Your draft is kept below. Please try again.
TEXT: mod_systemmanagement_email_required|Maintenance email email_required|This submission did not queue an email. Choose an audience and enter a subject and message. Your draft is kept below.
TEXT: mod_systemmanagement_email_too_long|Maintenance email email_too_long|This submission did not queue an email. Use at most 255 characters for the subject and 10,000 for the message. Your draft is kept below.
TEXT: mod_systemmanagement_email_queued|Maintenance email email_queued|Maintenance emails queued: {count}. Delivery is not yet confirmed; check the delivery history below. Your message remains below for reference.
TEXT: mod_systemmanagement_email_not_queued|Maintenance email email_not_queued|No maintenance email was queued by this submission. {reason} Your draft is kept below.
TEXT: mod_systemmanagement_email_incomplete|Maintenance email email_incomplete|Queueing did not complete. Confirmed queued: {count} of {total}. Some messages may already be queued or delivered. Your draft is kept below. Check the delivery history before retrying to avoid duplicate messages.
TEXT: mod_systemmanagement_email_unknown|Maintenance email email_unknown|The queueing outcome could not be confirmed. Your draft is kept below. Check the delivery history before retrying to avoid duplicate messages.
TEXT: mod_systemmanagement_email_no_recipients|Maintenance email email_no_recipients|No active users with valid email addresses match that audience.
TEXT: mod_systemmanagement_email_queue_failed|Maintenance email email_queue_failed|Communications could not queue the message.
