TEXT: mod_sightsandsounds_help_practice_title|Sights and Sounds help_practice_title|Practise animal identification
TEXT: mod_sightsandsounds_help_practice_summary|Sights and Sounds help_practice_summary|Members of this [-context-] can practise with its published photographs and calls. Browser practice requires a connection. In the mobile app, download all media before going offline.
TEXT: mod_sightsandsounds_help_practice_one|Sights and Sounds help_practice_one|Choose Start or resume. The random question selection stays the same when you return. Play a call as often as needed; use the image link to open the full-size photograph.
TEXT: mod_sightsandsounds_help_practice_two|Sights and Sounds help_practice_two|Type the animal name and choose Check answer to save it and see feedback. Matching ignores capitalisation and extra spaces. Other names must be explicitly accepted by the author; spelling is not guessed.
TEXT: mod_sightsandsounds_help_practice_three|Sights and Sounds help_practice_three|Return to incorrect questions until you reach 100%. Choose Finish practice to save a completed result for the assessment plan. Checked browser answers are saved on the server; unchecked typing is not. The app saves work on the phone; after finishing, choose Send results when connected and wait for confirmation. Practise a new set begins another run without a grade or retry limit.
TEXT: mod_sightsandsounds_help_authoring_title|Sights and Sounds help_authoring_title|Create a Sights & Sounds activity
TEXT: mod_sightsandsounds_help_authoring_summary|Sights and Sounds help_authoring_summary|Only [-authors-] in this [-context-] and site administrators can add questions and publish activities.
TEXT: mod_sightsandsounds_help_authoring_one|Sights and Sounds help_authoring_one|Upload a photograph or MP3 call. Preview it, enter the preferred identification, accepted alternatives one per line, feedback and a credit/licence. Saving adds the question to this bank.
TEXT: mod_sightsandsounds_help_authoring_two|Sights and Sounds help_authoring_two|Enter an activity title, instructions and question count. Publish makes an activity available to members using the questions currently in the bank. Adding questions later does not alter it.
TEXT: mod_sightsandsounds_help_authoring_three|Sights and Sounds help_authoring_three|Check all media and answers before saving. This initial version keeps questions and published activities read-only. It provides practice only; Activities can share this bank and be selected in the assessment plan. Keep practice weighting at zero. Graded assessment restrictions are not yet available.
TEXT: mod_sightsandsounds_help_recovery|Sights and Sounds help_recovery|If a request fails, keep a copy of your text and check whether it saved before retrying. Expired forms require a reload. Uploaded files must be selected again. Changing accounts or leaving the active [-context-] can remove access.

