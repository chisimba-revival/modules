TEXT: mod_sightsandsounds_rules_note|Sights and Sounds rules_note|Publishing fixes these rules. Formative downloads reserve one attempt and contain no answer keys. No new attempts start after the due date; existing attempts may submit late and are flagged.
TEXT: mod_sightsandsounds_formative_note|Sights and Sounds formative_note|Answers are saved without marking. Submit once when ready; the server returns your score. Downloading reserves an attempt. Interrupted downloads resume it. Late uploads are retained and flagged.
