MODULE_CREATEDATE: 2026-09-07
MODULE_ID: liveclass
MODULE_ICON: video
MODULE_NAME: Live Sessions
MODULE_DESCRIPTION: Schedule and deliver live [-context-] sessions and webinars through a configurable conferencing provider.
MODULE_AUTHORS: Chisimba Revival
MODULE_RELEASEDATE: 2026 09 07
MODULE_VERSION: 0.007
UPDATE_DESCRIPTION: Publish scheduled live sessions to the [-context-] calendar automatically.
UPDATE_DESCRIPTION: Keep a live session at the chapter level with the same navigation treatment as other pages.
UPDATE_DESCRIPTION: Use site-configured date and time formats when scheduling live sessions.
UPDATE_DESCRIPTION: Add scheduled live sessions to the [-context-] flow with featured event cards and an enforced joining window.
UPDATE_DESCRIPTION: Queue automatic 24-hour and 1-hour reminders for current [-readonlys-].
UPDATE_DESCRIPTION: Deliver live sessions through Google Meet, Zoom or another secure meeting link without dedicated media hosting.
UPDATE_DESCRIPTION: Add the provider-neutral live session foundation with optional BigBlueButton delivery.
MODULE_STATUS: alpha
MODULE_CATEGORY: collaboration
MODULE_ISADMIN: 0
MODULE_ISVISIBLE: 1
ISCONTEXTPLUGIN: 1
CONTEXT_AWARE: 1
DEPENDS_CONTEXT: 0
