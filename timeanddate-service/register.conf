MODULE_ID: timeanddate-service
MODULE_ICON: calendar-clock
MODULE_NAME: Time and Date Service
MODULE_DESCRIPTION: Canonical UTC storage, timezone conversion and human-readable date and time formatting.
MODULE_AUTHORS: Chisimba Revival
MODULE_RELEASEDATE: 2026 08 24
MODULE_VERSION: 1.001
UPDATE_DESCRIPTION: Register site timezone and display formats with System Configuration.
MODULE_STATUS: alpha
MODULE_PATH: timeanddate-service
MODULE_ISADMIN: 0
MODULE_ISVISIBLE: 0
MODULE_HASADMINPAGE: 0
ISADMIN: 0
ISVISIBLE: 0
MODULE_CATEGORY: service
TAGS: service|time|date|timezone|calendar
DEPENDS: sysconfig

CONFIG: TIMEANDDATE_TIMEZONE|Africa/Johannesburg|mod_timeanddate_service_timezone
CONFIG: TIMEANDDATE_DATE_FORMAT|j F Y|mod_timeanddate_service_dateformat
CONFIG: TIMEANDDATE_TIME_FORMAT|H:i|mod_timeanddate_service_timeformat
CONFIG: TIMEANDDATE_DATETIME_FORMAT|j F Y, H:i|mod_timeanddate_service_datetimeformat

TEXT: mod_timeanddate_service_timezone|Site timezone|Named IANA timezone used for site-wide input and display, for example Africa/Johannesburg
TEXT: mod_timeanddate_service_dateformat|Date display format|PHP date format used for dates, for example j F Y
TEXT: mod_timeanddate_service_timeformat|Time display format|PHP date format used for times, for example H:i
TEXT: mod_timeanddate_service_datetimeformat|Date and time display format|PHP date format used for combined dates and times, for example j F Y, H:i
