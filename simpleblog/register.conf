TEXT: mod_simpleblog26_help_summary|SimpleBlog publishing help_summary|Write for the site, your personal blog or an authorised [-context-] using the same publishing workflow.
TEXT: mod_simpleblog26_help_scope|SimpleBlog publishing help_scope|Check the destination and [-author-] above the form before writing. Personal publishing does not automatically allow site publishing.
TEXT: mod_simpleblog26_help_write|SimpleBlog publishing help_write|Add a title, then choose content blocks. Drag a block from the palette to its position on the canvas, or select it to add it at the end. Edit one block at a time; the others show previews. Select a preview or Edit block to work on it. Switching blocks retains unsaved edits but does not save the post. Add text, choose images or video, and arrange blocks by dragging or with Move up and Move down. Duplicate makes an independent copy. Undo last block change restores the previous arrangement. Sliders have manual navigation and do not autoplay. Provide alternative text for meaningful images. Block commands keep your edits in the form; Save draft stores the composition. Select [-categories-] and type tags to reuse suggestions. Authorised managers can add a [-category-] here.
TEXT: mod_simpleblog26_help_preview|SimpleBlog publishing help_preview|Choose Save draft and preview. This saves your work and opens an authorised preview; drafts are not visible to public readers.
TEXT: mod_simpleblog26_help_publish|SimpleBlog publishing help_publish|Choose Publish and preview when ready. Use the [-post-] list to find and edit your work. Saving it as a draft later removes it from public view.
TEXT: mod_simpleblog26_help_author|SimpleBlog publishing help_author|[-posts-] retain their original [-author-] and creation date. Your saved My Bio is reused on articles; edit it through the account menu.
TEXT: mod_simpleblog26_help_permissions|SimpleBlog publishing help_permissions|Admins and [-authors-] may have personal blogs. Assistants need explicit publishing permission. Site publishing is separately authorised; [-context-] publishing follows its teaching permissions. Personal blogs are not available to [-readonlys-]. Reading a [-context-] [-post-] requires membership. Comments and personal blog design are not enabled.

TEXT: mod_simpleblog26_conflict|Concurrent post edit warning|This [-post-] changed after you opened it. Your text is retained here. Copy your changes, reopen the latest [-post-] and merge them before saving.

