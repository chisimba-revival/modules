UPDATE_DESCRIPTION: Add contextual Rubric authoring actions and safe return navigation to Worksheet questions.
UPDATE_DESCRIPTION: Adds batch preparation and per-submission status for lecturer-reviewed AI marking suggestions.
UPDATE_DESCRIPTION: Redesigns lecturer Worksheet review with one shared rubric and full-width question cards.
UPDATE_DESCRIPTION: Retains AI marking drafts for safe recovery after lecturer edits and prevents accidental reruns.
UPDATE_DESCRIPTION: Reports submitted and marked Worksheet results correctly through the Gradebook provider contract.
UPDATE_DESCRIPTION: Adds lecturer-reviewed AI marking suggestions through the canonical AI service.
UPDATE_DESCRIPTION: Adds optional reusable rubric selection to Worksheet questions and lecturer marking.
UPDATE_DESCRIPTION: Adds the versioned default worksheet rubric and calibrated AI score bands.
UPDATE_DESCRIPTION: Adds the read-only Worksheet assessment provider adapter for Gradebook selection.
UPDATE_DESCRIPTION: Adds formative and summative Worksheet classification for Assessment Plan and Assessment Sheet.
UPDATE_DESCRIPTION: Repairs the Worksheet classification database migration for Module Catalogue.
UPDATE_DESCRIPTION: PHP 8 compatibility: replace deprecated split() calls in the Worksheet edit form.
