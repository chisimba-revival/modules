TEXT: mod_audience_confirm_queue|Audience confirm_queue|Queue this saved newsletter to all currently subscribed users? This may send email when the delivery worker runs.
TEXT: mod_audience_unsubscribe|Audience unsubscribe|Unsubscribe
TEXT: mod_audience_unsubscribe_help|Audience unsubscribe_help|Confirm below to stop subscriber announcements and [-webinar-] emails. Your registration history will be retained.
TEXT: mod_audience_unsubscribed_done|Audience unsubscribed_done|You have been unsubscribed. You will no longer receive subscriber announcements or [-webinar-] emails.
TEXT: mod_audience_schedule_help|Audience schedule_help|General announcements: every Monday, all subscribed users receive the upcoming [-webinars-], even when there is no [-webinar-] that week. Booked attendees: reminders at 08:00 on the Monday of their [-webinar-], at 08:00 on its morning, and 90 minutes before it starts, using the [-webinar-]’s local time. When the [-webinar-] is on Monday, the Monday and morning reminder are combined into one email. The support message is included when present. There are no first-of-month or after-[-webinar-] announcements. All other newsletters are manual. Enabling starts from now, without historical catch-up. Empty upcoming lists are skipped.
TEXT: mod_audience_help_title|Audience help_title|Subscribers and email
TEXT: mod_audience_help_users|Audience help_users|Use Users to search and edit contact details or unsubscribe someone. Preserve consent: an administrator must record explicit permission to resubscribe or change a subscribed email address.
TEXT: mod_audience_help_compose|Audience help_compose|Choose New newsletter, enter a subject, greeting and message. The latest completed [-webinar-]’s YouTube recording can appear after the greeting; if that [-webinar-] has no recording, nothing is inserted. You can also include upcoming [-webinars-] and support text. Save and preview before queuing. The preview contains only public [-webinar-] details and booking links.
TEXT: mod_audience_help_send|Audience help_send|Queue sends the saved version to a snapshot of current subscribers through the shared email queue. Unsubscribes and cancelled campaigns are checked again before delivery. The delivery worker must be configured and enabled. Passed to the email queue does not mean every message was delivered.
TEXT: mod_audience_help_recovery|Audience help_recovery|Saves do not reload the page. Failed saves retain your entries and provide a fresh form token. If your login expires, sign in in another tab and retry. Save before leaving; the page warns about unsaved changes.
TEXT: mod_audience_queued_count|Queue confirmation|Queued for %s subscribers. Delivery is handled by the email worker.
TEXT: mod_audience_delivery_restricted|Mail activation notice|Live email delivery is not enabled yet. You can save and preview drafts; queued newsletters will not be sent to the full subscriber list until delivery is activated.
