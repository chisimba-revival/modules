TEXT: mod_audience_banner_help|Newsletter banner guidance|The formatted preview includes a small banner before each upcoming [-webinar-] title when a registered image is available. The text alternative retains the title, date and time, and registration link. Save an existing draft again to refresh both previews. Queued emails retain their reviewed content.

