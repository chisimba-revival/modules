TEXT: mod_audience_compose_help|Audience compose_help|Use {FIRSTNAME} for the first part of the subscriber’s recorded name, or “there” when no name is available. The preview keeps the placeholder; each outgoing email replaces it. The greeting comes first, followed by the latest [-webinar-] recording when selected and available, then your message. Upcoming [-webinars-] and the support message are optional. Save to refresh the preview before queuing.
TEXT: mod_audience_footer_help|Audience footer_help|A personal unsubscribe link is added to every delivered email. No private [-webinar-] joining links are included.
TEXT: mod_audience_delivery_help|Audience delivery_help|Queued means prepared for delivery, not delivered. The Communications worker must be enabled to send emails. Cancelling stops messages that have not yet been sent.
TEXT: mod_audience_consent|Audience consent|I have the subscriber’s explicit permission
TEXT: mod_audience_evidence|Audience evidence|Consent evidence or reason for change
TEXT: mod_audience_consent_help|Audience consent_help|Changing a name does not change subscription consent. To subscribe someone again, or change the address of a subscribed contact, record their explicit permission. Unsubscribed and suppressed contacts are excluded from announcements.
TEXT: mod_audience_invalid|Audience invalid|Check the entered values before saving.
