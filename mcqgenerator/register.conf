TEXT: mod_mcqgenerator_source_encoding|Invalid encoding|This text is not valid UTF-8. Save it as UTF-8 text and upload it again.
TEXT: mod_mcqgenerator_source_controls|Invalid control characters|This source contains unsupported control characters. Export it as plain UTF-8 text and try again.
