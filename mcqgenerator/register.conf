TEXT: mod_mcqgenerator_source_large|Large source|The source exceeds the 5 MiB size limit. This is a file-size limit, not the previous 40,000-character limit.
TEXT: mod_mcqgenerator_capacity_unknown|Unknown model limits|The configured AI model needs its context and output capacities set in AI Services before this chapter can be processed. Your source is saved.
TEXT: mod_mcqgenerator_capacity_changed|Changed provider|The AI configuration changed during processing. Start again after checking the AI settings. Your source is saved.
TEXT: mod_mcqgenerator_capacity_sections|Too many sections|This source needs more than 30 sections with the configured AI capacity. Choose a model with a larger context or use a smaller source. No AI request was made.
TEXT: mod_mcqgenerator_section_progress|Section progress|Completed {done} of {total} sections. The next section will start automatically. Keep this page open; completed sections are saved.
TEXT: mod_mcqgenerator_continue_sections|Continue processing|Process next section
TEXT: mod_mcqgenerator_validation_partial|Incomplete generation|Processing stopped before the whole chapter was covered. The completed questions are retained below, but this is a partial set. No failed request was automatically retried.

TEXT: mod_mcqgenerator_help_longchapters_title|Whole chapter help title|Whole chapters and automatic sections
TEXT: mod_mcqgenerator_help_longchapters|Whole chapter help|Upload or paste the whole chapter, up to 5 MiB. The generator checks the configured model capacity and processes sections automatically when needed. Multiple sections mean multiple provider requests. Keep the page open. Each completed section is saved before the next begins; reopening a page resumes between sections. Interrupted in-flight requests are not automatically repeated. If a provider fails, completed questions are retained with a partial-coverage warning. Unknown models require capacity settings in AI Services. Question allocation is spread across sections and extra candidates remain available for review.

