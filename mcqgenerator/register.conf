TEXT: mod_mcqgenerator_help_title|Question workshop: help_title|Making questions for offline use
TEXT: mod_mcqgenerator_help_summary|Question workshop: help_summary|Save source material, generate a draft, review it and download a question paper with a separate answer key.
TEXT: mod_mcqgenerator_help_source|Question workshop: help_source|Give the set a useful title. Paste text or choose a TXT or ODT file. Choose a question count from 1–30. Save and check the extracted source before generation. Images are ignored; check that tables and lists read sensibly.
TEXT: mod_mcqgenerator_help_generate|Question workshop: help_generate|Confirm you are authorised to send the source to the configured AI service. Choose 1–30 questions when creating the set. The original source remains saved even if generation fails. Retry only after checking the reported problem.
TEXT: mod_mcqgenerator_help_review|Review help|Check each question and its source evidence. Flagged questions start excluded. Tick Include this question in the final set to retain a question, or leave it unticked to exclude it. Correct malformed questions and duplicate answers before including them. Save your choices before downloading. Excluded questions remain editable and can be included later; the final set may contain fewer questions than requested.
TEXT: mod_mcqgenerator_help_download|Question workshop: help_download|Download questions and answer keys separately in text or editable ODT format. Downloads contain your last saved edits. The question paper does not contain answers or supporting excerpts.
TEXT: mod_mcqgenerator_help_privacy_title|Question workshop: help_privacy_title|Privacy and access
TEXT: mod_mcqgenerator_help_privacy|Question workshop: help_privacy|Administrators and [-authors-] can use the tool. Only the owner can open or download their saved sets. A public [-context-] does not make a set public. Source text is sent to the configured AI provider only when you explicitly generate questions.
TEXT: mod_mcqgenerator_help_recovery_title|Question workshop: help_recovery_title|Saving and recovery
TEXT: mod_mcqgenerator_help_recovery|Question workshop: help_recovery|Source material is saved before generation. If an upload fails, select the file again; pasted text is kept on the page. Failed edits remain visible so you can copy them. If another tab changed the set, reopen its current version before saving. An interrupted generation is not automatically resent. To remove a failed extraction or unwanted set, select the Delete set button beside Open set and confirm in the popup. This removes the saved source and questions permanently; downloaded and imported course copies remain.
TEXT: mod_mcqgenerator_help_course_title|Question workshop: help_course_title|Course question banks
TEXT: mod_mcqgenerator_help_course|Question workshop: help_course|Saved sets are retained independently of any [-context-]. Enter a [-context-] where you have teaching permission, reopen the reviewed set and use Import to course. This creates an inactive MCQ test as a question pool, which the existing course-question lookup can reuse. It does not publish an assessment. Each set imports once; later edits do not overwrite that copy.
TEXT: mod_mcqgenerator_count|Question workshop: count|Number of questions (1–30)
TEXT: mod_mcqgenerator_count_invalid|Question workshop: count_invalid|Choose a whole number from 1 to 30.
TEXT: mod_mcqgenerator_import_course|Question workshop: import_course|Import to course
TEXT: mod_mcqgenerator_import_explain|Question workshop: import_explain|Import the last saved, reviewed questions to the named [-context-] as an inactive MCQ question pool. This does not publish an assessment. Each set imports once; subsequent edits here do not change the imported copy.
TEXT: mod_mcqgenerator_select_course|Question workshop: select_course|Optional: copy this set into a [-context-] MCQ question bank. Open the destination [-context-] first, then return to this saved set to import it. This is not needed for offline downloads.
TEXT: mod_mcqgenerator_imported|Question workshop: imported|An inactive MCQ copy was imported to:
TEXT: mod_mcqgenerator_course_forbidden|Question workshop: course_forbidden|Select a valid [-context-] where you have teaching permission. No questions were imported.
TEXT: mod_mcqgenerator_review_required|Question workshop: review_required|Save and confirm your review before importing questions.
TEXT: mod_mcqgenerator_already_imported|Question workshop: already_imported|This set was already imported to another [-context-]. The existing copy has not been changed.

