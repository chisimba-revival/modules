TEXT: mod_mcqgenerator_validation_title|Review checks|Questions needing review
TEXT: mod_mcqgenerator_validation_intro|Review check introduction|These checks flag possible problems in the AI response. Returned questions are kept below where available. Flagged questions start excluded; you can correct them or include them after checking the source yourself.
TEXT: mod_mcqgenerator_validation_count|Question workshop: validation_count|Requested {expected} questions, but the AI returned {actual}.
TEXT: mod_mcqgenerator_validation_format|Question workshop: validation_format|Question {question}: a question, supporting excerpt, four non-empty options or a valid correct-answer number was missing or incorrectly formatted.
TEXT: mod_mcqgenerator_validation_duplicates|Question workshop: validation_duplicates|Question {question}: two or more answer options were identical. Four distinct options are required.
TEXT: mod_mcqgenerator_validation_quote|Question workshop: validation_quote|Question {question}: the AI claimed the quotation below came from your source, but it could not be found there. It may have paraphrased or changed punctuation; the checker cannot confirm the evidence.
TEXT: mod_mcqgenerator_validation_next|Review next steps|Use Include this question in the final set to keep or exclude each question, then save. Only included questions are downloaded or imported, numbered consecutively. Including a flagged quotation records your judgement; it does not mean the automated source check passed. Original warnings remain visible. Older failures may contain only a report because their questions were not retained.

