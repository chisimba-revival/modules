TEXT: mod_mcqgenerator_help_exams_title|Exam help title|Building an exam from chapters
TEXT: mod_mcqgenerator_help_exams|Exam help introduction|Use Exam question generator from Multiple Choice Generator. Each private exam has its own chapter question sets and saved paper. No course or additional AI generation is needed.
TEXT: mod_mcqgenerator_help_exam_select|Exam selection help|Create a named exam. Choose a chapter set, tick the questions you want, and select Add selected questions. Repeat for each chapter. Excluded source questions are not offered; review and include them in the source set first if needed. Questions already added cannot be added twice from the same set. The saved chapter title, source question number and revision are retained. Answer positions are mixed when questions are added. To mix an existing exam, select Mix answer positions when saving, save, then review and download both files again. Green badges show how many questions from each chapter are saved in this exam. The total above the chapter picker counts all saved exam questions, including chapters on other pages. Counts update after adding questions or saving removals.
TEXT: mod_mcqgenerator_help_exam_arrange|Exam arrangement help|Under Arrange and review, edit the title and candidate instructions. The running total shows how many questions will remain after saving. Use Remove from exam to exclude a question; Undo removal restores it before saving. Save exam applies the removals without changing source chapters. The chapter-selection total separately shows saved questions, newly ticked questions and the total after adding them. Save before moving to another chapter. Whole-number marks range from 1–100, and each exam can contain up to 200 questions. Tick the review confirmation once you have checked everything.
TEXT: mod_mcqgenerator_help_exam_download|Exam download help|Download the question paper and marking sheet as separate ODT files. Both use the same saved order and marks. The question paper contains no answers or evidence excerpts. The marking sheet includes correct answers, source references and supporting excerpts. Unreviewed exams are labelled as drafts. You can hide chapter headings on the paper while keeping them on the marking sheet.
TEXT: mod_mcqgenerator_help_exam_bank|Future question-bank integration|Course question-bank integration by chapter is deferred until that service has been reviewed. Your saved exam keeps source references for that work. Adding questions here does not publish or import an assessment.
TEXT: mod_mcqgenerator_exam_mark|Single mark|mark
TEXT: mod_mcqgenerator_generation_timeout|AI timeout|The AI provider did not return before the configured response timeout. Your source is safe, but this request saved no questions. This is not a question-format or source-length error. A provider charge may still have occurred. You can retry explicitly; no request is repeated automatically. If this recurs, ask an administrator to review the AI request timeout.

TEXT: mod_mcqgenerator_session_count|Session count preference|This count becomes the default for new sets during this login session. The initial default is 10.
TEXT: mod_mcqgenerator_more_title|More questions heading|Add more questions
TEXT: mod_mcqgenerator_more|Generate additional questions|Generate additional questions
TEXT: mod_mcqgenerator_additional_count|Additional count|Number of additional questions
TEXT: mod_mcqgenerator_more_explain|Additional generation explanation|Save your edits first. Choose how many extra questions to request: for example, add 5 to an existing set of 5 to reach 10. Existing questions and exclusions are kept. This makes another paid AI request and asks for different questions from the same source. Repeated stems are removed, but review for similar meanings yourself. Up to 30 saved candidates are supported. Existing exam and course copies remain unchanged.
TEXT: mod_mcqgenerator_more_limit|Additional limit|Choose at least one additional question, keeping the total number of saved candidates at 30 or fewer.
TEXT: mod_mcqgenerator_more_capacity|Additional prompt capacity|The configured model has too little capacity to generate additional questions with the existing-question references. Your saved set is unchanged.
TEXT: mod_mcqgenerator_validation_additional_shortfall|Additional shortfall|Requested {expected} additional questions; saved {actual} new candidates. Repeated stems were omitted, or generation stopped early. Your original questions are unchanged. No automatic retry was made.
TEXT: mod_mcqgenerator_help_more_title|More questions help title|Additional questions and session defaults
TEXT: mod_mcqgenerator_help_more|More questions help|New sets start at 10 questions. The last valid count used when creating or generating a set becomes the default for new sets during this login session. For an existing generated set, save any edits and open Add more questions. Enter the extra number required, confirm AI use and generate. The original questions, edits and exclusions are kept; new candidates are appended for review. Matching stems are discarded, but you should check for questions with similar meanings. Failure keeps your original questions and reports how many new candidates were retained. Up to 30 candidates can be saved. Existing exam snapshots and course imports are independent and are not updated automatically.
TEXT: mod_mcqgenerator_validation_additional_timeout|Additional request timeout|The additional-question request timed out. Your original questions remain saved. No request was repeated automatically; a provider charge may still have occurred.

