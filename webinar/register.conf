TEXT: mod_webinar_registration_limit|Registration capacity field|Registration limit
TEXT: mod_webinar_registration_limit_help|Registration capacity guidance|Defaults to 170 registrations. Choose a whole number from 1 to 100,000. Pending email confirmations hold a place for up to 24 hours. Lowering the limit does not cancel existing registrations; new bookings stop until space is available.
