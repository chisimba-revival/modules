TEXT: mod_webinar_editing_help_title|Webinar editor and classification|Create and maintain webinars
TEXT: mod_webinar_editing_help_summary|Webinar editor and classification|Authorised site editors can manage webinars and speaker biographies. Public visitors can browse published pages and register without an account.
TEXT: mod_webinar_editing_help_content|Webinar editor and classification|Choose Add webinar or Edit an existing card. Enter a title and description, select a public banner image and choose published speakers. You can add a speaker and biography alongside the form; save the webinar afterwards to keep the selection. Editing a speaker biography updates every linked webinar.
TEXT: mod_webinar_editing_help_schedule|Webinar editor and classification|Enter local start and end times and choose the time zone. Completed webinars appear in Archive automatically. Enable Accept registrations when booking should open, or mark a cancellation. Existing registrations remain attached when dates change. Saving does not email attendees; arrange a separate change announcement when necessary.
TEXT: mod_webinar_editing_help_classification|Webinar editor and classification|Select existing [-categories-] and enter comma-separated tags. Tag suggestions reuse the shared site vocabulary. Only [-category-] managers can add a [-category-]. The historical WordPress event categories are imported separately from event types such as Archive.
TEXT: mod_webinar_editing_help_save|Webinar editor and classification|Save draft keeps the page private to authorised editors and closes public booking. Publish / save changes makes it public. Preview opens the saved version in a new tab. Ajax saves keep you in place; if your session expires, your entries remain and a new form token lets you retry. Conflicting saves are rejected so another editor’s changes are not silently overwritten.
TEXT: mod_webinar_editing_help_join|Webinar editor and classification|Joining links are not placed on public pages. They are included in confirmation and reminder emails for verified registrants. A recording link can be added when the webinar is complete. Rescheduling or cancellation suppresses queued messages for the old schedule; it does not create a change-announcement email.
UPDATE_DESCRIPTION: Permission-controlled webinar and speaker editing, transactional saves, subject classification and archive taxonomy migration.
