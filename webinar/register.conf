TEXT: mod_webinar_registration_help|Registration guidance|No site account is needed. We will email a confirmation link before completing your registration. Please use an address you can access.
TEXT: mod_webinar_confirm_help|Confirmation guidance|Confirm that you requested this webinar registration and the subscription described on the registration form.
TEXT: mod_webinar_unsubscribe_help|Unsubscribe guidance|This stops subscriber notifications and webinar emails, including reminders. Your existing registration remains recorded. You can deliberately subscribe again when registering for another webinar.
