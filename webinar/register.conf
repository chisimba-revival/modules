TEXT: mod_webinar_management_count_help|Staff count definition|Counts show confirmed registrations with active, current consent. Pending email confirmations also reserve places for up to 24 hours, so booking can close before the confirmed count reaches the limit.
TEXT: mod_webinar_editing_help_capacity|Registration limit and totals|Manage webinars shows confirmed registration totals and the limit for each event you are permitted to see. Administrators see all counts; original creators see their own. Set Registration limit under Booking and save to change the default of 170. Pending email confirmations reserve places until their 24-hour link expires. Fully booked events reject new registrations; duplicate submissions do not use another place. Lowering a limit keeps existing confirmed registrations and stops new bookings until space is available. A pending confirmation is rechecked against the current limit. Refresh the management page to see updated counts. Saving a limit does not email attendees.

