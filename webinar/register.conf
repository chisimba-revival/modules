TEXT: mod_webinar_helpbody|Help guidance|Choose a [-webinar-] to read about the talk and its [-speakers-]. Use Watch video when a recording is available. Select a [-speaker-] name on a [-webinar-] card to open their biography without leaving the list. Press Escape or Close to return, or choose View [-speaker-] page for their other [-webinars-]. The banner and title both open the [-webinar-]. Choose Recordings to browse talks with videos. You do not need an account to browse the archive or register. When signed in, your saved name and email are filled in automatically. The booking form checks the entered email and tells you if you are already registered. For an upcoming [-webinar-], use Booking details on its page, enter your name and email address, and read the subscription choice. Validation messages stay beside the form and retain your entries. Use the emailed confirmation link to complete registration. Every [-webinar-] email includes an unsubscribe link.

