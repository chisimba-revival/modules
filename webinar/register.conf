TEXT: mod_webinar_videos_help_summary|Recordings help summary|Browse full-length videos from our YouTube channel. Shorts are not included.
TEXT: mod_webinar_videos_help_play|Playback help|Select a thumbnail or title to open the video player. The player loads only when selected. Press Escape or Close to stop playback and return to the cards.
TEXT: mod_webinar_videos_help_more|Browse help|Choose Load more to add the next six videos without leaving this page. If loading fails, choose it again. Without JavaScript, the link opens the next page and videos open on YouTube.
TEXT: mod_webinar_videos_help_subscribe|Subscription help|Subscribe on YouTube opens the channel in a new tab. YouTube controls subscriptions; this does not subscribe you to Learn-the-Birds emails or create a site account.
UPDATE_DESCRIPTION: Dedicated full-length YouTube recordings gallery with lazy cards, on-demand playback, incremental browsing and contextual Help.

