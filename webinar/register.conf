TEXT: mod_webinar_reminder_select|Choose dashboard event|Choose webinar
TEXT: mod_webinar_reminder_show|Open dashboard event|Show dashboard
TEXT: mod_webinar_reminder_help_summary|Dashboard introduction|Administrators can review registrations, capacity and automated email progress for each webinar. Viewing this page never queues or sends email.
TEXT: mod_webinar_reminder_help_schedule|Reminder scheduling|Morning sends use South African Standard Time (SAST), defaulting to 08:00. Subscribers receive the general webinar-day email; registered attendees also receive their own morning reminder and a reminder starting 90 minutes before the event. Registered subscribers receive both morning emails. The existing event-week Monday reminder has a separate control and is omitted for Monday events to avoid duplicating the attendee morning reminder. Weekly newsletters remain under Weekly email / Newsletters.
TEXT: mod_webinar_reminder_help_counts|Delivery progress|Pending means eligible recipients not yet placed in the outbox; before scheduling this is a current estimate. Queued means waiting for delivery or a retry. Sent means accepted by the mail transport, not proof of inbox delivery. Failed means retries were exhausted; cancelled or skipped includes consent or event changes. Counts refresh when you reload this page.
TEXT: mod_webinar_reminder_help_changes|Saving controls|Select the webinar, enable the required sends, choose the morning time and pre-event lead time, then save. Enabling a send does not catch up a time that has already passed. Completed sends are not repeated when settings are saved. Disable a send to stop its remaining queued messages at the delivery check; messages already accepted cannot be recalled. Stale concurrent edits are rejected and your entries are kept.
TEXT: mod_webinar_reminder_help_delivery|Scheduler and delivery timing|The scheduler starts queueing at the displayed time and accepts a delay of up to one hour while the event is still open. Delivery takes additional time according to the queue, provider speed and retries. Increase the pre-event lead time if necessary. Check the last worker run and any missed, failed or cancelled counts. Use Edit webinar to change its registration limit. Saving reminder controls does not send a newsletter immediately.
