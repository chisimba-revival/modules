TEXT: mod_sitepages_help_title|Help title|Create and edit public pages
TEXT: mod_sitepages_help_summary|Help summary|Site administrators and authorised page editors can build information pages using shared content blocks.
TEXT: mod_sitepages_help_steps|Help steps|Use the edit icon beside a public page title, or choose Manage pages to select a page or create one. Enter its title and web address. Add and arrange blocks. Blocks start as previews; choose Edit block to change one. Save page beside the active block or at the bottom saves the entire page without closing the editor. Wait for the saved confirmation; errors leave your edits in place. Choose Draft or Published before saving.
TEXT: mod_sitepages_help_recovery|Help recovery|Block changes are not saved until you choose Save page. Validation and stale-save errors keep your submitted content. Keep this tab open while signing in again if your session expires. A draft is visible only to site administrators and authorised page editors.

