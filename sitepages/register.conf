UPDATE_DESCRIPTION: Separate the page list from focused editing, clarify save and page settings, and render page headings and content together.
TEXT: mod_sitepages_help_edit|Pages guide edit|Page content shows editable blocks in reading order. Choose Edit block or its preview to change text or images. Use the arrows to move a block; Insert block after adds content at that position. The page list is separate from this editor.
TEXT: mod_sitepages_help_save|Pages guide save|Choose Save page at the top, beside the active block or at the bottom. It saves the whole page. Wait for the saved confirmation before choosing View saved page or All pages.
TEXT: mod_sitepages_help_settings|Pages guide settings|Saving, publishing and recovery
TEXT: mod_sitepages_help_imported_title|Pages guide imported_title|Headings and imported content
TEXT: mod_sitepages_help_imported|Pages guide imported|The page title identifies the whole page and appears above its cards. Each content block is displayed as a card, with its Heading inside the card above its Text. Older imports may contain separate heading-only blocks; these appear inside the following content card. Image-left and image-right blocks each keep their own card. Stored blocks are not merged or removed.

TEXT: mod_sitepages_showtitle|Page title display setting|Show page title
TEXT: mod_sitepages_showtitlehelp|Page title display help|Clear this to hide the title above the page content. The title is still used in the page list and browser tab. Block headings and publication status are unchanged.
