TEXT: mod_sitepages_help_title|Help title|Create and edit public pages
TEXT: mod_sitepages_help_summary|Help summary|Edit one page at a time. The page list, editor and saved public page are separate views.
TEXT: mod_sitepages_help_steps|Choose a page|Choose the pencil beside a public page title to edit that page directly. In All pages, choose a title or pencil, or choose New page. Check the Editing heading to confirm which page you have opened.
TEXT: mod_sitepages_help_recovery|Help recovery|Block edits are not saved until you choose Save page. Page settings contains the web address, Draft/Published status and Show page title checkbox. Clear Show page title to hide the heading above the content, then Save page. The title remains in the page list and browser tab; block headings are unaffected. Saving a published page updates the public page immediately; drafts are visible only to authorised editors. View saved page shows the saved version, so save your changes before leaving the editor. All pages returns to the list. Validation or concurrent-edit errors retain your work; keep this tab open while resolving them.

