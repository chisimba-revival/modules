TEXT: mod_membership_service_help_operations_title|Membership operations contextual Help title|Manage membership access
TEXT: mod_membership_service_help_operations_summary|Membership operations contextual Help summary|Create and maintain audited membership periods without changing roles assigned to that person in a [-context-].
TEXT: mod_membership_service_help_operations_step_person|Membership operations first Help step|Choose the correct person by full name and username.
TEXT: mod_membership_service_help_operations_step_period|Membership operations second Help step|Choose the membership tier and set the start and end dates.
TEXT: mod_membership_service_help_operations_step_reason|Membership operations third Help step|Record a clear reason that another authorised operator will understand later.
TEXT: mod_membership_service_help_operations_step_check|Membership operations fourth Help step|Save the change and confirm the resulting period in Membership history.
TEXT: mod_membership_service_help_manual_heading|Manual membership Help heading|Use manual membership deliberately
TEXT: mod_membership_service_help_manual_body|Manual membership Help text|Use a manual membership for an approved exception, invited member or offline payment. Do not create a false payment record.
TEXT: mod_membership_service_help_lifecycle_heading|Membership lifecycle Help heading|Grace, restoration and ending access
TEXT: mod_membership_service_help_lifecycle_body|Membership lifecycle Help text|Set a clear end for grace access. Restore active status after recovery. End membership when access must stop; its history remains.
TEXT: mod_membership_service_help_roles_heading|Membership role Help heading|Membership is separate from [-context-] roles
TEXT: mod_membership_service_help_roles_body|Membership role Help text|A tier controls entitlement. The [-readonly-] and [-author-] roles control participation within each [-context-].
TEXT: mod_membership_service_help_history_heading|Membership history Help heading|Preserve the audit history
TEXT: mod_membership_service_help_history_body|Membership history Help text|Editing creates an audited amendment. Retain historical periods and record the reason before shortening paid access.
