TEXT: mod_registration_service_terms_title|Terms heading|Terms of Use and Privacy Notice
TEXT: mod_registration_service_terms_version|Policy version label|Version
TEXT: mod_registration_service_policy_eyebrow|Legal information eyebrow|Legal information
TEXT: mod_registration_service_policy_summary|Policy page summary|These terms explain how the learning platform may be used and how personal information is handled.
TEXT: mod_registration_service_terms_of_use_title|Terms of Use document heading|Terms of Use
TEXT: mod_registration_service_terms_of_use_intro|Terms introduction|These Terms of Use apply when you create an account, enter a course, use learning resources, submit work or otherwise use this learning platform. The organisation identified on the platform operates the service. By using the service, you agree to these terms and any course-specific rules shown to you.
TEXT: mod_registration_service_terms_accounts_heading|Terms accounts heading|Accounts and access
TEXT: mod_registration_service_terms_accounts_p1|Terms accounts paragraph one|Provide accurate information, keep your sign-in details private and tell the platform operator if you believe your account has been compromised. You are responsible for activity carried out through your account unless the operator is at fault.
TEXT: mod_registration_service_terms_accounts_p2|Terms accounts paragraph two|Access may depend on registration, payment, membership, admission, prerequisites or an invitation. Access given to one person may not be shared or transferred. Course roles and permissions continue to determine what each user may see or do.
TEXT: mod_registration_service_terms_learning_heading|Terms learning heading|Learning services and results
TEXT: mod_registration_service_terms_learning_p1|Terms learning paragraph one|The platform provides educational content, activities, communication, assessments, progress records and related services. Course descriptions explain the intended outcomes, requirements and any certificate or continuing-development recognition offered.
TEXT: mod_registration_service_terms_learning_p2|Terms learning paragraph two|Participation does not guarantee a particular result, qualification, employment outcome or professional recognition unless an authorised course description expressly says otherwise. You remain responsible for meeting applicable professional, institutional or regulatory requirements.
TEXT: mod_registration_service_terms_conduct_heading|Terms conduct heading|Acceptable use
TEXT: mod_registration_service_terms_conduct_p1|Terms conduct paragraph one|Use the platform lawfully and respectfully. Do not interfere with the service, bypass access controls, impersonate another person, introduce harmful code, scrape restricted material, harass others, submit dishonest work or use another person's answers or account.
TEXT: mod_registration_service_terms_conduct_p2|Terms conduct paragraph two|Do not upload material that is unlawful, abusive, misleading or infringes another person's privacy or intellectual-property rights. Course-specific academic-integrity and participation rules also apply where they are displayed.
TEXT: mod_registration_service_terms_content_heading|Terms content heading|Content and intellectual property
TEXT: mod_registration_service_terms_content_p1|Terms content paragraph one|Unless stated otherwise, course materials, platform content, names, logos and designs belong to the platform operator, the relevant instructor or another identified rights holder. Access is for your personal learning use; it does not transfer ownership or permit republication, resale or broad distribution.
TEXT: mod_registration_service_terms_content_p2|Terms content paragraph two|You retain ownership of material you submit. You give the operator and relevant course staff permission to store, process, display and assess it only as reasonably needed to operate the platform, deliver the course, maintain records and support you.
TEXT: mod_registration_service_terms_payments_heading|Terms payments heading|Fees, cancellations and refunds
TEXT: mod_registration_service_terms_payments_p1|Terms payments paragraph one|Where a fee applies, the price, currency, billing period and available payment method are shown before payment. Additional course-specific payment, cancellation or refund terms must be presented before purchase and form part of these terms.
TEXT: mod_registration_service_terms_payments_p2|Terms payments paragraph two|Payment may be handled by an external payment provider. Access may be delayed, suspended or withdrawn when a payment fails, is reversed or is refunded, subject to applicable law and any course-specific terms.
TEXT: mod_registration_service_terms_availability_heading|Terms availability heading|Availability and third-party services
TEXT: mod_registration_service_terms_availability_p1|Terms availability paragraph one|Reasonable efforts are made to keep the platform secure and available, but uninterrupted or error-free operation cannot be guaranteed. Maintenance, security incidents, connectivity problems and services supplied by others may affect availability.
TEXT: mod_registration_service_terms_availability_p2|Terms availability paragraph two|Links and integrations may lead to services operated by others. Their own terms and privacy notices apply. The platform operator is not responsible for third-party services outside its reasonable control.
TEXT: mod_registration_service_terms_end_heading|Terms ending heading|Suspension and ending access
TEXT: mod_registration_service_terms_end_p1|Terms ending paragraph one|Access may be restricted or suspended to protect users or the platform, investigate misuse, enforce these terms, comply with law or address unpaid fees. Where appropriate, the operator will explain the reason and provide a reasonable opportunity to respond.
TEXT: mod_registration_service_terms_end_p2|Terms ending paragraph two|You may stop using the platform at any time. Ending access does not automatically erase records that must be retained for educational, contractual, financial, security, dispute-resolution or legal purposes.
TEXT: mod_registration_service_terms_changes_heading|Terms changes heading|Changes, responsibility and contact
TEXT: mod_registration_service_terms_changes_p1|Terms changes paragraph one|The operator may update these terms when the platform, law or operating arrangements change. Material changes will be identified through the platform or another reasonable channel, and a new acceptance may be requested where appropriate.
TEXT: mod_registration_service_terms_changes_p2|Terms changes paragraph two|The operator remains responsible for providing the service with reasonable care and does not exclude rights or remedies that cannot lawfully be excluded. Questions, complaints or formal notices should be sent using the contact details published on the platform.
TEXT: mod_registration_service_privacy_notice_title|Privacy Notice document heading|Privacy Notice
TEXT: mod_registration_service_privacy_notice_intro|Privacy introduction|The platform operator processes personal information to operate an eLearning service and serve users' educational needs. This notice describes the information involved, why it is used, when it may be shared and the choices available to you.
TEXT: mod_registration_service_privacy_collect_heading|Privacy collection heading|Information we collect
TEXT: mod_registration_service_privacy_collect_p1|Privacy collection paragraph one|We may collect identity and contact details, account credentials, profile information, course enrolments, memberships, attendance, progress, submissions, assessment results, certificates, communications, support requests and preferences that you provide or that arise through learning activity.
TEXT: mod_registration_service_privacy_collect_p2|Privacy collection paragraph two|We may also record device and browser information, network address, sign-in and security events, dates and times, pages or features used and diagnostic records. Instructors or authorised administrators may add information needed for admission, teaching, assessment, learner support or record keeping.
TEXT: mod_registration_service_privacy_use_heading|Privacy purposes heading|Why we use information
TEXT: mod_registration_service_privacy_use_p1|Privacy purposes paragraph one|We use personal information to register and authenticate users; provide courses and learning resources; manage admission, membership and payments; communicate about learning; assess work; track progress; issue records or certificates; provide support; and improve accessibility, reliability and educational effectiveness.
TEXT: mod_registration_service_privacy_use_p2|Privacy purposes paragraph two|We also use information to secure the platform, prevent abuse, keep audit and operational records, resolve disputes, meet contractual and legal duties and protect the rights of users, instructors, clients and the operator. We limit use to purposes that are relevant and reasonably necessary.
TEXT: mod_registration_service_privacy_share_heading|Privacy sharing heading|Who may receive information
TEXT: mod_registration_service_privacy_share_p1|Privacy sharing paragraph one|Information may be available to authorised platform administrators, instructors, assessors, support staff and organisations responsible for a course, but only to the extent needed for their work. A course may identify additional responsible institutions or accreditation bodies.
TEXT: mod_registration_service_privacy_share_p2|Privacy sharing paragraph two|We may use carefully selected providers for hosting, email, communications, analytics, security, document generation and other operational functions. Information may also be disclosed when required by law, to protect legitimate rights or safety, or during a properly managed organisational transfer. We do not sell personal information.
TEXT: mod_registration_service_privacy_payment_heading|Privacy payments heading|Payments
TEXT: mod_registration_service_privacy_payment_p1|Privacy payments paragraph one|Payment providers process card, bank or wallet details under their own privacy notices and security arrangements. The learning platform should not receive or store complete card credentials when payment is handled on a provider's secure service.
TEXT: mod_registration_service_privacy_payment_p2|Privacy payments paragraph two|We may retain transaction references, product or course, amount, currency, payment status, dates, refunds, disputes and related audit information needed to provide access, support customers, reconcile accounts and meet financial or legal duties.
TEXT: mod_registration_service_privacy_retention_heading|Privacy retention heading|Retention
TEXT: mod_registration_service_privacy_retention_p1|Privacy retention paragraph one|We keep information only for as long as reasonably needed for the purposes described here. Different periods may apply to pending registrations, active accounts, learning records, assessment evidence, certificates, communications, security logs and financial records.
TEXT: mod_registration_service_privacy_retention_p2|Privacy retention paragraph two|When an account is closed or a deletion request is accepted, information that is no longer needed will be deleted or de-identified. Some records may be retained where necessary to operate the service, preserve educational or certification records, prevent fraud, resolve disputes or comply with law.
TEXT: mod_registration_service_privacy_security_heading|Privacy security heading|Security and international processing
TEXT: mod_registration_service_privacy_security_p1|Privacy security paragraph one|We use reasonable organisational and technical safeguards appropriate to the information and the service. No online system is completely risk-free, so you should also protect your password, devices and recovery channels and report suspected misuse promptly.
TEXT: mod_registration_service_privacy_security_p2|Privacy security paragraph two|Providers or course organisations may process information in another country. Where this occurs, the operator will use appropriate contractual, legal or organisational safeguards required by applicable data-protection law.
TEXT: mod_registration_service_privacy_rights_heading|Privacy rights heading|Your information and choices
TEXT: mod_registration_service_privacy_rights_p1|Privacy rights paragraph one|Depending on applicable law, you may ask to view or obtain a copy of your personal information, correct inaccurate information, object to or restrict certain processing, withdraw consent where consent is relied upon, or ask for deletion or portability. You may also complain to the operator or an appropriate regulator.
TEXT: mod_registration_service_privacy_rights_p2|Privacy rights paragraph two|These rights are not absolute. Before acting, we may need to verify your identity. A request may be limited where information must be retained for operational, educational, contractual, financial, security or legal reasons, or where another person's rights would be affected. The operator will explain material limitations.
TEXT: mod_registration_service_privacy_children_heading|Privacy children heading|Children and supervised learners
TEXT: mod_registration_service_privacy_children_p1|Privacy children paragraph one|Courses intended for children or learners who require guardian or institutional authorisation must use an appropriate enrolment and consent process. A child should not create an account independently where applicable law or the course requires a parent, guardian or authorised institution to act.
TEXT: mod_registration_service_privacy_changes_heading|Privacy changes heading|Changes and contact
TEXT: mod_registration_service_privacy_changes_p1|Privacy changes paragraph one|This notice may be updated when information practices, services or legal requirements change. Material changes will be identified through the platform or another reasonable channel, and the version displayed here will be updated.
TEXT: mod_registration_service_privacy_changes_p2|Privacy changes paragraph two|Use the contact details published on the platform to ask a privacy question, exercise a right or raise a concern. The platform operator should identify the responsible organisation and an appropriate privacy contact alongside those details.
