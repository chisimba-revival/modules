TEXT: mod_kanban_help_subtasks_body|Subtask editing help|People with edit or manage access can open Edit beside a subtask, change its title and select Save. The title updates in place without reloading the project or changing its completion checkbox. Cancel discards that subtask's unsaved title and returns focus to Edit. Closing Edit keeps the draft. Errors keep your text; no uncertain save is retried automatically. If someone else changed the title, check the saved version in another tab before reloading and reviewing your draft. View-only and public links cannot edit subtasks.
TEXT: mod_kanban_view_exit|Exit project focus|Exit project focus
TEXT: mod_kanban_help_view_title|Project workspace help|Finding and focusing on a project
TEXT: mod_kanban_help_view_body|Project workspace guidance|Focus on boards hides the surrounding page, scope selector and creation controls while keeping all boards in the selected scope. Exit boards focus or Escape restores the page without refreshing or losing drafts. Boards retain their expanded or collapsed state. Collapse on a board hides its contents; Collapse on a task hides only that task's details. Neither hides the page header. Focus project instead fills the viewport with one project; Exit project focus or Escape returns to the overview. Projects start collapsed; use Expand to open them. Saving tasks updates them in place. A recovered draft opens its project automatically. Focus changes the view only, not permissions or saved data. Focus on boards sits beside Full screen. In Focus project, Collapse all tasks hides the task details in that project; Expand all tasks restores them without losing edits. Full screen uses your browser's fullscreen mode; its Exit full screen button restores the window. If your browser refuses fullscreen, use Focus on boards instead.
