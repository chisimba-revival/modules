UPDATE_DESCRIPTION: Show task status counts with the shared skin pill primitive.
UPDATE_DESCRIPTION: Replace ambiguous icon-only controls with visible action labels.
UPDATE_DESCRIPTION: Replace ambiguous scope buttons with a labelled board-scope selector.
UPDATE_DESCRIPTION: Align scope actions and use shared view and full-screen icons.
UPDATE_DESCRIPTION: Strengthen project hierarchy with completion, recency and column counts.
UPDATE_DESCRIPTION: Use compact Kanban actions and keep scope controls in one aligned row.
UPDATE_DESCRIPTION: Keep full-screen compact and explicit when an icon alone is unclear.
UPDATE_DESCRIPTION: Add collapsible boards and persistent ordering within each scope.
UPDATE_DESCRIPTION: Move tasks in place and refresh status counts without a page reload.
UPDATE_DESCRIPTION: Separate board tools and use compact Add controls.
UPDATE_DESCRIPTION: Give project summaries distinct progress, ordering and management hierarchy.
UPDATE_DESCRIPTION: Keep project ordering controls compact and unambiguous.
UPDATE_DESCRIPTION: Reorder boards in place without a page refresh.
UPDATE_DESCRIPTION: Add Kanban boards to the Site Administration navigation.
UPDATE_DESCRIPTION: Use the active Chisimba service base class under PHP 8.5.
