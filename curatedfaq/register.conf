TEXT: mod_curatedfaq_help_reading_summary|FAQ help_reading_summary|Find published answers by searching or choosing a category.
TEXT: mod_curatedfaq_help_reading_steps|FAQ help_reading_steps|Select a question to expand its answer. Select it again to close it. Keyboard users can focus a question and press Enter or Space. Search covers questions and answers; Clear filters returns to the full list.
TEXT: mod_curatedfaq_help_editing|FAQ help_editing|Managing frequently asked questions
TEXT: mod_curatedfaq_help_editing_summary|FAQ help_editing_summary|Only site administrators can create, edit, publish or archive questions.
TEXT: mod_curatedfaq_help_editing_steps|FAQ help_editing_steps|Choose Add a question or Edit. Write the question and formatted answer, choose categories and an order number, then Save question. Drafts and archived questions remain private. Publish makes the answer visible immediately. Existing categories are shared with other site content.
TEXT: mod_curatedfaq_help_recovery|FAQ help_recovery|Changes are kept in this browser tab until a successful save. If your session expires, keep the editor open, sign in using the separate-tab link, then return and save. After reloading, choose Restore unsaved draft. Recovery keeps the original revision, so a newer saved edit is not silently overwritten. If a save cannot be confirmed, compare with the saved question before retrying. Closing the tab or clearing browser storage may remove local drafts.
