UPDATE_DESCRIPTION: Allow safe same-page anchors for content block buttons.
UPDATE_DESCRIPTION: Allow dynamic block providers to explain an inactive editor preview.
UPDATE_DESCRIPTION: Keep imported heading fragments with the next content card.
UPDATE_DESCRIPTION: Frame editor blocks with shared compact cards so previews and editing controls are visually grouped.
UPDATE_DESCRIPTION: Consolidate deployed publishing, social, video collection and audio capabilities into shared source.
UPDATE_DESCRIPTION: Clarify course landing-content authoring and use a concise transcript label when viewing welcome videos.
UPDATE_DESCRIPTION: Add reusable text and welcome-video blocks for the [-context-] landing page without coupling them to chapters.
UPDATE_DESCRIPTION: Complete the active-journey terminology audit and preserve configured role and context names.
UPDATE_DESCRIPTION: Require a video URL only while Video Hero is selected so hidden validation cannot block other content blocks.
UPDATE_DESCRIPTION: Accept YouTube, Vimeo and direct video URLs in Video Hero while retaining optional File Manager selection.
UPDATE_DESCRIPTION: Add a wide, text-free Video Hero block and compact side-column Information block spacing.
UPDATE_DESCRIPTION: Use a task-oriented Content Blocks label and ordinary-language administration search terms.
UPDATE_DESCRIPTION: Give Content Blocks its distinct semantic blocks icon.
MODULE_RELEASEDATE: 2026-09-12
UPDATE_DESCRIPTION: Correct double-escaped save routes and select managed images through File Manager.
UPDATE_DESCRIPTION: Clarify wide main-content and side-column block placement labels.
UPDATE_DESCRIPTION: Match dbTable init signature and add an inheritance compatibility probe.
UPDATE_DESCRIPTION: Declare context lecturer rules and restore required Chisimba docblocks.
