TEXT: mod_calendar_help_view_title|Calendar viewing help title|View calendar events
TEXT: mod_calendar_help_view_summary|Calendar viewing help summary|Browse the month and filter the event categories already available to you.
TEXT: mod_calendar_help_view_filter|Calendar filter instructions|Select or clear a category checkbox to show or hide its events in both the month grid and the event list. Filtering does not change or delete events.
TEXT: mod_calendar_help_view_details|Small-calendar detail instructions|In a side calendar, select an event title to expand its time and details. Use Tab to reach the title and Enter or Space to open or close it.
TEXT: mod_calendar_help_view_month|Calendar navigation instructions|Use the previous and next month links to browse. Category selections reset when a new page loads. An empty month displays a no-events message.
