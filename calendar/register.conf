TEXT: mod_calendar_help_edit_scope|Secure Calendar help_edit_scope|Personal events belong to you. Instructors manage their class events; site events require an administrator. Existing events keep their original calendar.
TEXT: mod_calendar_help_edit_dates|Secure Calendar help_edit_dates|For one day, use the same first and last date. A series can span up to one year. Daily end time must not be earlier than start time.
TEXT: mod_calendar_help_edit_save|Secure Calendar help_edit_save|Saving updates the entire series and retains its first event ID. Delete opens a confirmation page before anything is removed.
TEXT: mod_calendar_help_edit_recovery|Secure Calendar help_edit_recovery|An expired token retains your entries. If another edit changes the series, or a response is interrupted, keep this tab open and check the saved event in another tab before making a fresh edit.
