TEXT: mod_personalspace_help_title|Personal Space editing help|Arrange My Work Space
TEXT: mod_personalspace_help_summary|Personal Space editing help|Your personal layout belongs to your signed-in account. Changing it does not change anyone else’s layout.
TEXT: mod_personalspace_help_edit|Personal Space editing help|Select Turn Editing On to show the block controls. Use Tab to reach controls and Enter or Space to activate buttons.
TEXT: mod_personalspace_help_add|Personal Space editing help|Choose a block to preview it, then select Add Block. A successful addition reloads the page so the block starts normally.
TEXT: mod_personalspace_help_move|Personal Space editing help|Use Move block up or Move block down to change the order. Each successful change saves immediately.
TEXT: mod_personalspace_help_remove|Personal Space editing help|Remove block asks for confirmation. Cancel or Escape keeps the block. Removing a placement does not delete its source content.
TEXT: mod_personalspace_help_recover|Personal Space editing help|If the page reports a stale layout or interrupted save, reload before continuing. Do not repeat an uncertain save. A renewed security token keeps your selection so you can retry after a definite rejection.

TEXT: mod_personalspace_leftpicker|Left column block picker|Add a block to the left column
TEXT: mod_personalspace_middlepicker|Main column block picker|Add a block to the main column
TEXT: mod_personalspace_rightpicker|Right column block picker|Add a block to the right column

TEXT: mod_personalspace_unavailableblock|Unavailable saved placement|This block is no longer available. You can remove its placement.
