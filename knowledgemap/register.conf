TEXT: mod_knowledgemap_course_role_help|Semantic course blueprint role_help|Drag a semantic element onto a node, or select a node and click an element. You can also use the Semantic role menu. Tag the central node as a [-context-]. Decorative icons do not assign roles.
TEXT: mod_knowledgemap_course_blueprint|Semantic course blueprint blueprint|[-context-] blueprint
TEXT: mod_knowledgemap_course_preview|Semantic course blueprint preview|Preview outline
TEXT: mod_knowledgemap_course_create|Semantic course blueprint create|Create or regenerate [-context-]
TEXT: mod_knowledgemap_course_code_label|Semantic course blueprint code_label|[-context-] code
TEXT: mod_knowledgemap_course_code_help|Semantic course blueprint code_help|Use 1 to 32 lower-case letters or digits. A linked [-context-] keeps its existing code.
TEXT: mod_knowledgemap_course_protection|Semantic course blueprint protection|Generation creates a private, unpublished [-context-]. Only an untouched empty outline can be regenerated. Descriptions, page content, quiz questions or other edits protect it from replacement. Delete the linked [-context-] first if you need to generate a replacement. Editing the map never updates the [-context-] automatically.
TEXT: mod_knowledgemap_course_save_first|Semantic course blueprint save_first|Wait for the map to save, then preview the outline again. If saving failed, keep this map open and resolve the save error first.
