TEXT: mod_knowledgemap_course_error_parent|Semantic course blueprint error_parent|This semantic role is not allowed beneath its parent. Check the role or move this node:
TEXT: mod_knowledgemap_course_error_detached|Semantic course blueprint error_detached|Connect this tagged node to the central [-context-] node:
TEXT: mod_knowledgemap_course_error_title|Semantic course blueprint error_title|Give this tagged node a title:
TEXT: mod_knowledgemap_course_error_description|Semantic course blueprint error_description|Use one Description branch per item:
TEXT: mod_knowledgemap_course_error_quiz_title|Semantic course blueprint error_quiz_title|Quiz titles must be at most 60 characters:
TEXT: mod_knowledgemap_course_forbidden|Semantic course blueprint forbidden|You need management access to this map and permission to create [-contexts-]. Managing a linked [-context-] also requires its author permissions.
TEXT: mod_knowledgemap_course_stale|Semantic course blueprint stale|The map changed after this preview. Save any changes and preview again.
TEXT: mod_knowledgemap_course_invalid|Semantic course blueprint invalid|Correct the outline problems before creating the [-context-].
TEXT: mod_knowledgemap_course_code|Semantic course blueprint code|Choose a code containing 1 to 32 lower-case letters or digits. The code root is reserved.
TEXT: mod_knowledgemap_course_linked|Semantic course blueprint linked|This map already has a linked [-context-]. Delete it before creating a replacement with another code.
TEXT: mod_knowledgemap_course_locked|Semantic course blueprint locked|The linked [-context-] contains content or has been edited. It cannot be overwritten. Delete it first if a replacement is required.
TEXT: mod_knowledgemap_course_exists|Semantic course blueprint exists|That [-context-] code is already in use or has retained content from an earlier [-context-]. Choose another code.
TEXT: mod_knowledgemap_course_session|Semantic course blueprint session|This request expired. Preview again after signing in. Your map remains open.
TEXT: mod_knowledgemap_course_ready|Semantic course blueprint ready|Review the complete outline, including added container chapters and excluded nodes, before creating the [-context-].
TEXT: mod_knowledgemap_course_created|Semantic course blueprint created|The private, unpublished [-context-] is ready for authoring.
TEXT: mod_knowledgemap_course_help_summary|Semantic course blueprint help_summary|Map managers who can create [-contexts-] can turn a saved semantic map into an editable [-context-] outline.
TEXT: mod_knowledgemap_course_help_text|Semantic course blueprint help_text|Course, section, chapter and page nodes supply titles only. An attached Description node supplies text for a [-context-], section or chapter. A Content node supplies text for its parent page. Tagged text uses the node note when present, otherwise its title. Ordinary notes, links and attachments are not copied. Quiz nodes belong beneath chapters and appear after their pages. A Quiz node’s Note supplies source text for background question generation. A Quiz with an empty Note remains empty. Existing Quiz input children are still supported.
TEXT: mod_knowledgemap_course_help_preview|Semantic course blueprint help_preview|Save the map and choose Preview outline. Pages directly beneath a [-context-] or section receive a container chapter shown in the preview. Untagged nodes are excluded; tagged nodes beneath them must be moved or their parent tagged. Top-level branches follow clockwise order: down the right side, then up the left side, starting at the upper right. Items within each chapter retain their branch order.
TEXT: mod_knowledgemap_course_help_create|Semantic course blueprint help_create|Choose an unused code and create the outline. Continue writing pages and quiz questions in the [-context-] editor. Review settings and publish there when ready.
TEXT: mod_knowledgemap_course_help_protection_title|Semantic course blueprint help_protection_title|Protecting authored work
TEXT: mod_knowledgemap_course_help_recovery_title|Semantic course blueprint help_recovery_title|Recovering from an error
TEXT: mod_knowledgemap_course_help_recovery|Semantic course blueprint help_recovery|Keep the map open if a save or request fails. Resolve session errors and save again, then request a fresh preview. Creation is atomic. After an uncertain response, preview again: the existing linked code is retained. Do not delete a [-context-] merely to retry a failed request.

