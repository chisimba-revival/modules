TEXT: mod_knowledgemap_course_quiz_input|Quiz source role|Quiz input
TEXT: mod_knowledgemap_course_error_quiz_input|Quiz input validation|Quiz source text must contain 100 to 300000 characters in total.
TEXT: mod_knowledgemap_course_quiz_summary|Quiz source preview|Questions queued from quiz input:
TEXT: mod_knowledgemap_course_quiz_jobs|Quiz generation progress|View quiz generation progress
TEXT: mod_knowledgemap_course_quiz_help|Quiz input guidance|Place each Quiz beneath a Chapter. Paste the source text directly into the Quiz node’s Note (100 to 300000 characters). Questions are queued when the outline is created and stay inactive for review. Put a review chapter at the end of a section or course for a broader quiz.

TEXT: mod_knowledgemap_course_nested_course|Nested course validation|A [-context-] cannot contain another [-context-]. Remove the existing assignment first.
TEXT: mod_knowledgemap_course_assign_pages|Bulk chapter pages action|Assign pages below chapters
TEXT: mod_knowledgemap_course_assign_pages_help|Bulk chapter pages help|Assigns untagged immediate children of every chapter as pages. Existing semantic roles and deeper branches are preserved. You can then change selected pages to Quiz. A [-context-] cannot be nested inside another [-context-].
TEXT: mod_knowledgemap_course_pages_assigned|Bulk chapter pages result|Assigned {count} nodes as pages.
TEXT: mod_knowledgemap_course_pages_none|Bulk chapter pages empty|No untagged nodes directly below chapters need assigning.

TEXT: mod_knowledgemap_course_quiz_note_help|Quiz Note guidance|Paste the source text for this quiz here (100 to 300000 characters). Creating the outline queues question generation in the background. Leave Note empty to create an empty quiz. Generated questions stay inactive for review.

