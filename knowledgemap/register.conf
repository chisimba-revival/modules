TEXT: mod_knowledgemap_ordering_help|Knowledge map editor ordering_help|Earlier and later set sibling order. Main branches run from top to bottom on each side. Put chapters on the same side for one continuous sequence. Add sibling inserts after the selected node. Save the map to keep these changes.
TEXT: mod_knowledgemap_media_help|Knowledge map editor media_help|Create means new material is required; use means existing material is required. This purpose is saved separately from the decorative icon. No media is created automatically.
TEXT: mod_knowledgemap_provider_help|Knowledge map editor provider_help|Push sends selected map content to a module; pull brings module content into the map. These connections are not implemented yet. File import is separate.
