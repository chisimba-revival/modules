TEXT: mod_knowledgemap_course_selection|Quiz bank selection|Question selection

TEXT: mod_knowledgemap_course_per_attempt|Quiz bank per_attempt|Draw randomly for each attempt

TEXT: mod_knowledgemap_course_fixed|Quiz bank fixed|Draw once and save a fixed test

TEXT: mod_knowledgemap_course_bank_help|Quiz bank bank_help|Generate 10 to 100 questions. The quiz uses up to that many questions. A fresh draw is saved for each attempt, so resuming keeps the same questions. A fixed test uses the same selection for everyone. Review the bank and test before activation. Bank edits do not automatically change test copies.

TEXT: mod_knowledgemap_course_error_quiz_settings|Quiz bank error_quiz_settings|Choose 10 to 100 bank questions and a quiz size between 1 and the bank size. Very long source text needs at least one question per source chunk.

TEXT: mod_knowledgemap_arrange_branches|Branch toolbar menu|Arrange branches
TEXT: mod_knowledgemap_course_toolbar_help|Compact toolbar guidance|Arrange branches groups movement, spacing and tidy actions in one toolbar menu. Semantic elements opens the role palette in the toolbar. Select a node, then click a role, or drag a role onto a node. The palette also contains Assign pages below chapters. These panels float over the map. Press Escape or click outside to close.
