TEXT: mod_knowledgemap_ordering_help|Knowledge map editor ordering_help|Earlier and later set sibling order. Main branches run from top to bottom on each side. Put chapters on the same side for one continuous sequence. Add sibling inserts after the selected node. Save the map to keep these changes.
TEXT: mod_knowledgemap_media_help|Knowledge map editor media_help|Create means new material is required; use means existing material is required. This purpose is saved separately from the decorative icon. No media is created automatically.
TEXT: mod_knowledgemap_provider_help|Knowledge map editor provider_help|Push sends selected map content to a module; pull brings module content into the map. These connections are not implemented yet. File import is separate.
TEXT: mod_knowledgemap_media_group|Knowledge map media icon group|Media

TEXT: mod_knowledgemap_node_colour|Node colour label|Node colour
TEXT: mod_knowledgemap_colour_help|Immediate colour help|Colour changes immediately. Use the palette button to apply this colour to the selected node and its descendants. Save the map to keep changes.
TEXT: mod_knowledgemap_quick_add|Quick insertion tooltip|Add child; Ctrl-click or Command-click to add a sibling
TEXT: mod_knowledgemap_shortcut_help|Insertion keyboard help|Click + to add a child. Ctrl-click or Command-click + adds a sibling, except on the main node. With a map node focused, Insert adds a child and Shift+Enter adds a sibling.

TEXT: mod_knowledgemap_personal_icons|Personal icon group|Personal icons
TEXT: mod_knowledgemap_manage_icons|Personal icon folder link|Manage personal icons (opens a new tab)
TEXT: mod_knowledgemap_personal_icons_help|Personal icon instructions|In My files, create a folder named km-icons and upload SVG, PNG, JPEG, GIF, WebP or BMP images. Save your map before reloading to see new icons. Private images remain subject to file permissions when a map is shared.
UPDATE_DESCRIPTION: Clarify the map library with visible panel cards and collapsed creation/import sections.

