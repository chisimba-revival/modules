TEXT: mod_grassguide_help_rights|Rights help|Rights and publication is the private administrator audit. Review photo thumbnails and filter for NC images, species without commercial alternatives, planned tasks or resolved tasks. Assign a reviewer and due date in Review rights / replacement. Image replacement work summarises current task progress; it does not grant reuse rights. Public app updates are off by default. Enable them to share only the policy-filtered catalogue with the free app; accounts are not required. NC images remain allowed in the default noncommercial edition. Assign replacement work, target dates and private evidence through Review rights / replacement. Progress alone never grants permission. Commercial mode filters app downloads at export time, so future worker imports cannot bypass it. Explicit permission needs evidence and a public credit and stops applying if the content changes. Preview commercial catalogue never changes the saved policy. Downloads omit private notes and evidence. Management screens and editorial downloads remain restricted to site administrators; only the enabled, policy-filtered app feed is public.

