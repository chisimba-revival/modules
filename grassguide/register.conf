TEXT: mod_grassguide_remove_help|Removal confirmation|Remove this species from the app catalogue? Its record, photographs and history will be retained under Archived so you can restore it. Phones lose the entry on their next successful catalogue update; offline copies remain until then. Importing the original list again will not restore it.
TEXT: mod_grassguide_restore_help|Restoration confirmation|Restore this species to the app catalogue as a draft? Its existing details and photographs will be retained. It reaches phones on their next successful catalogue update, subject to the saved publication policy.
TEXT: mod_grassguide_membership_help|Membership guidance|If this species does not belong in the regional guide, remove it from the catalogue. Its content will remain recoverable.
TEXT: mod_grassguide_removed_notice|Archived guidance|This species is removed from the app catalogue. Restore it here when appropriate; its content has been retained.
TEXT: mod_grassguide_help_membership|Catalogue management help|Choose Add species and enter only the genus and epithet; the common name is optional. The worker fetches available data automatically. Use Remove from catalogue on a catalogue card and confirm to exclude an incorrect species. Filter by Archived to find removed species and choose Restore to catalogue to return one as a draft. Removal preserves media and history, and importing the seed list will not undo it. Phones receive additions and removals on their next successful catalogue update; no app reinstall is needed. A stale confirmation must be reopened before retrying.

