TEXT: mod_grassguide_permission_notice|Permission explanation|Record permission covering commercial app display and distribution, or your ownership and chosen reuse terms. Evidence stays private; the public statement accompanies permitted content. Permission is bound to the current content and source; later changes require review. This does not relicense the original work. Exclusions remain effective when content changes.
