TEXT: mod_grassguide_default_subject|Default permission subject|Permission to use your grass photographs in the Lowveld and Kruger field guide
TEXT: mod_grassguide_default_opening|Default greeting|Hello %s,\n\nI am developing Grasses of the Lowveld and Kruger, a field-guide app to help people recognise our local grasses. Thank you for sharing your photographs.
TEXT: mod_grassguide_default_request|Default permission request|May I have your permission to use the photographs listed below in the Grasses of the Lowveld and Kruger mobile app and its accompanying field guide on KengaLearn?\n\nThe app is currently free, but I may introduce a small annual charge to help cover its costs. I am therefore asking explicitly for permission covering future paid access as well as free use, including copies downloaded for offline use. I would retain your credit and a link to the source, and may resize or crop images for display. You would retain copyright; I am asking for non-exclusive permission.\n\nPlease note that nearly all of my photographs are made available under CC BY or CC0, because I believe freely sharing brings more back to the community than restricting access. NC restrictions can create barriers even for projects that charge only to recover costs, and can reduce opportunities for your photographs to reach a wider audience.\n\nPlease grant me permission to use all of your photos as listed in this email. If you wish to change the credit wording from that used on iNaturalist, please provide an alternative wording. If you prefer not to grant permission, I will respect that. Thank you for considering the request.
TEXT: mod_grassguide_queue_permission|Queue request action|Queue permission request for sending
TEXT: mod_grassguide_queue_again|Queue subsequent request|Queue another permission request
TEXT: mod_grassguide_queue_notice|Queue action notice|This queues exactly the saved message shown above to the displayed recipient using the site mail service. The worker may send it shortly afterwards. Queueing is not a grant of image permission.
TEXT: mod_grassguide_save_before_queue|Incomplete draft notice|Save a valid email address and draft before queueing. The site must have a working SendGrid sender configured.
TEXT: mod_grassguide_permission_already_pending|Pending request notice|A request for this contributor is already queued. Refresh later to check its status before sending another.
TEXT: mod_grassguide_contact_email_invalid|Invalid contact address|Enter and save a valid contributor email address before queueing.
TEXT: mod_grassguide_no_permission_images|No outstanding images|There are no current NC images awaiting commercial clearance for this contributor.
TEXT: mod_grassguide_permission_mail_unavailable|Mail configuration error|The permission request cannot be queued because the site mail sender is not configured for SendGrid delivery. Your draft is retained.
TEXT: mod_grassguide_permission_queue_failed|Queue failure|The mail service could not queue this request. Your saved draft is retained; check the site's mail configuration and recipient restrictions.
TEXT: mod_grassguide_permission_history|Request history heading|Permission-request history
TEXT: mod_grassguide_permission_history_help|Request status explanation|Queued means waiting for the mail worker, including automatic delivery retries. Accepted by mail provider does not confirm inbox delivery or permission. Expand a request to see the exact text that was queued. Replies arrive in the sender's mailbox and are not imported automatically.
TEXT: mod_grassguide_no_permission_history|Empty request history|No permission requests have been queued for this contributor.
TEXT: mod_grassguide_mail_queued|Queued request|Queued
TEXT: mod_grassguide_mail_sent|Sent request|Accepted by mail provider
TEXT: mod_grassguide_mail_failed|Failed request|Failed
TEXT: mod_grassguide_mail_cancelled|Cancelled request|Cancelled
TEXT: mod_grassguide_mail_unknown|Missing delivery record|Delivery status unavailable
TEXT: mod_grassguide_help_contact_mail|Permission request workflow|In NC image contributors, select a name and its image count, then View contributor. View contributed images opens a popup; Escape or Close images closes it. Save an email address, personalised opening, standard request and signature. Saving does not send. Check the saved preview, sender, recipient and photo links, then explicitly Queue permission request for sending. The existing communications worker sends it; request history retains the exact message and delivery status. Repeated submissions do not queue duplicates, and a pending request prevents another until it finishes. Draft edits do not change already queued messages. Replies are handled in the sender's mailbox; record permission evidence separately for each image. Contacts and requests are private and never enter the app feed or contributor CSV.

TEXT: mod_grassguide_permission_queued|Queued request confirmation|Permission request queued for sending. Its exact contents and delivery status are recorded below.

TEXT: mod_grassguide_use_standard_request|Replace draft body with current template|Use updated standard request

TEXT: mod_grassguide_upload_photos|Batch action|Upload photos
TEXT: mod_grassguide_photos_help|Batch instructions|Choose up to 10 JPEG, PNG or WebP photos (10 MB each, 40 MB total; up to 24 megapixels and 8192 pixels per side). Enter one caption per photo in the numbered order shown below. Separate captions with commas; put a caption containing a comma in double quotes. Example: Whole plant, "Flower head, close up", Ligule. You can edit each photo and its diagnostic view afterwards.
TEXT: mod_grassguide_photo_files|Upload error|Choose 1–10 valid JPEG, PNG or WebP images, no more than 10 MB each and 40 MB total, up to 24 megapixels and 8192 pixels per side. An upload may also exceed the server limit. No photos or NC settings have been changed. Keep this page open to correct the batch.
TEXT: mod_grassguide_caption_count|Caption mismatch|Enter exactly one non-empty caption per selected photo, in the numbered order. Separate captions with commas and enclose captions containing commas in double quotes.
TEXT: mod_grassguide_captions|Caption list label|Captions (comma separated)
TEXT: mod_grassguide_photo_selection|File selection label|Photos
TEXT: mod_grassguide_photo_mode|Replacement choice|Existing NC images
TEXT: mod_grassguide_photo_add|Add radio|Add my photos and keep existing images
TEXT: mod_grassguide_photo_replace|Replacement radio|Replace all NC images and stop importing NC images for this species
TEXT: mod_grassguide_photo_replace_help|Replacement explanation|Replacement archives the existing NC images only after the whole batch succeeds. Their credits and rights history remain available. Other images and videos stay. The app receives the changes on its next catalogue update; previously downloaded copies cannot be recalled. Your NC import setting stays in effect for later uploads.
TEXT: mod_grassguide_photo_blocked|NC blocked status|NC image imports are stopped for this species.
TEXT: mod_grassguide_photo_allowed|NC allowed status|NC image imports are allowed for this species.
TEXT: mod_grassguide_resume_nc|Resume action|Allow future NC imports again
TEXT: mod_grassguide_resume_help|Resume explanation|This allows new NC images from future source checks. Previously archived images stay archived; you can restore individual images through Edit.
TEXT: mod_grassguide_upload_save|Batch save action|Upload and save photos
TEXT: mod_grassguide_upload_rights|Own image rights explanation|Choose the credit and licence for your own photographs. These apply to the whole batch. The photos become available through the app catalogue when app updates are enabled.
TEXT: mod_grassguide_help_photos|Batch upload help|Open a species and choose Upload photos. Select your files, then enter comma-separated captions in the numbered preview order; quote any caption containing a comma. Check the credit and licence for the batch. Choose whether to keep existing images or archive all NC images and stop future NC imports. Upload and save changes the entire batch together. On an error, the enhanced form keeps your files and text; without JavaScript, reselect the files. For an uncertain network result, reload and check before retrying. Allow future NC imports again reverses the block without restoring archived images. Edit each saved image to change its caption or diagnostic view. This workflow is administrator-only.

TEXT: mod_grassguide_premium_access|App premium management|Grass app premium
TEXT: mod_grassguide_premium_required|Premium access error|This account has no grass app premium grant. Viewing the species list remains free.
TEXT: mod_grassguide_premium_intro|Device activation explanation|Create an activation code for your own Grass App installation. In the app, open Species list, then Activate premium, and paste the code. Codes only unlock the grass checklist; they do not grant administration access. Keep each code private. It is shown once here and stored encrypted on Android. Browser activation lasts for the current tab only.
TEXT: mod_grassguide_premium_offline|Offline access explanation|The app checks access online and can use its last successful check offline for up to 30 days. A lifetime account grant has no expiry; reconnect to renew the device check. Revocation takes effect when the device next checks online, or when its offline period ends. Your checklist syncs to your account and remains available offline. Changes made offline are queued until reconnecting. If two devices change the same species, the last change synced wins. Removing activation does not delete your checklist.
TEXT: mod_grassguide_device_name|Device label|Device name
TEXT: mod_grassguide_create_premium_key|Activation action|Create activation code
TEXT: mod_grassguide_activation_code|Activation output|Activation code — copy this now
TEXT: mod_grassguide_premium_devices|Active device list|Your activation codes
TEXT: mod_grassguide_revoke_premium_key|Revoke device action|Revoke this code
TEXT: mod_grassguide_premium_key_limit|Activation limit|Revoke an unused activation code before creating another. Up to 20 codes may be active.
TEXT: mod_grassguide_premium_lifetime|Lifetime status|Lifetime premium is active for your account.
TEXT: mod_grassguide_premium_active|Premium status|Premium is active for your account.
TEXT: mod_grassguide_help_premium|Premium help|Grass app premium is account-based. Only a holder of the premium entitlement can create scoped activation codes on this administrator page. Copy a newly created code into the app's Activate premium screen. Use a name to identify each installation and revoke lost codes here. The public species list stays free. Premium enables a private checklist that syncs to the account and works offline on each device; favourites remain separate. The app keeps up to 30 days of verified offline access. Revoking an activation code or the account grant prevents future renewal, but cannot immediately recall access from a disconnected device. No payment or public subscription signup is enabled.

TEXT: mod_grassguide_flag_image|Image review action|Flag incorrect image
TEXT: mod_grassguide_excluded|Excluded media state|Incorrect image — hide and block re-import
TEXT: mod_grassguide_exclusion_reason|Private exclusion reason|Reason for hiding this image (private)
TEXT: mod_grassguide_exclusion_help|Exclusion guidance|Choose Incorrect image to remove it from the public catalogue and block automatic re-import for this species. A reason is required. The record and credits remain here for review. Choose Active to restore it. Existing apps receive the removal with their next successful catalogue update; offline copies may still show it until then.
TEXT: mod_grassguide_observation_grade|Observation quality grade|iNaturalist observation grade
TEXT: mod_grassguide_grade_research|Research grade|Research Grade
TEXT: mod_grassguide_grade_needs_id|Needs identification|Needs ID
TEXT: mod_grassguide_grade_casual|Casual grade|Casual
TEXT: mod_grassguide_grade_unavailable|Unmatched observation|Grade unavailable
TEXT: mod_grassguide_help_image_review|Image review help|On a species, choose Flag incorrect image beside a photo, enter a private reason and save the Incorrect image status. It is hidden from public exports and blocked from automatic re-import for that species, while retained for review. Restore by choosing Active. Observation grades are source metadata, not a guarantee of correct identification. The worker matches exact photo IDs in a bounded observation search; unmatched photos show Grade unavailable.
TEXT: mod_grassguide_open_observation|Observation link|Open iNaturalist observation
