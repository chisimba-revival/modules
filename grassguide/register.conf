TEXT: mod_grassguide_help_summary|Help summary|Source workers populate the Lowveld and Kruger catalogue automatically. Site administrators use Edit for maintenance and improvements. Saving or marking reviewed does not publish content or make an immediate API call.
TEXT: mod_grassguide_help_setup|Setup help|Open Setup and readiness, inspect the species to add, then import. Repeat imports add only missing records and preserve previous edits. The imported ecology still needs evidence. Use Fetch available data to queue Kew taxonomy, GBIF and Wikipedia text, and licensed iNaturalist photographs. Workers run outside page requests; refresh this page to see progress. Your edits are preserved, including deliberately cleared fields. Completed results are cached for 30 days. Rate limits pause a provider and retry automatically; unmatched names remain visible for later maintenance.
TEXT: mod_grassguide_help_species|Species help|Search by scientific name, common name or synonym. Edit the distinguishing features, habitat and evidence. Select all applicable inflorescence forms, leaving unknown traits unselected. Save before adding media. Renames preserve the previous name as a synonym and require renewed taxonomic review.
TEXT: mod_grassguide_help_media|Media help|Licensed iNaturalist taxon photographs are added automatically with attribution. Their diagnostic view remains unclassified. You can improve their captions and view labels, archive unsuitable images, add your own image references, or add optional YouTube videos. Manual additions require the source, photographer and exact licence.
TEXT: mod_grassguide_help_recovery|Recovery help|Failed saves keep your entries. An expired token can be renewed by trying again after signing in in another tab. A conflict means another save already changed the record: open the latest version separately and reconcile. Uncertain network responses are not retried automatically. Save before leaving; unsaved edits trigger a browser warning.
TEXT: mod_grassguide_help_export|Export help|Download editorial catalogue exports all records and credits, including drafts, archived content and private notes. Keep it private. It is not a public mobile content bundle, includes no media files and does not replace a full database backup. Source workers populate the catalogue independently; the export includes their imported content and attribution.

