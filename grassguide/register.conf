TEXT: mod_grassguide_add_help|Minimal species creation|Enter the genus and species epithet, for example Themeda and triandra. The common name is optional. After saving, the background worker fetches available names, descriptions and photographs. Coverage varies; you can maintain the details afterwards. The species joins the app catalogue immediately and reaches phones on their next successful catalogue update.
