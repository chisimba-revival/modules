TEXT: mod_grassguide_progress_notice|Progress explanation|These counts cover active photographs in the private editorial catalogue. Use Planned and Resolved filters to follow replacement work. A resolved task does not grant reuse permission: the NC count changes only when images are replaced, archived or their recorded rights change. New photographs may increase the count. Public app users cannot see this audit or its tasks.

