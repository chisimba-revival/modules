TEXT: mod_grassguide_contributors_help|Contributor list guidance|These are the recorded credits for active NC images in the active catalogue. Exact matching names are grouped as contact leads, not verified identities or ownership: two people may share a name, and one person may use different names. Open each source page to find the photographer and available contact options. Email addresses are not collected and no messages are sent. Record any permission, its scope and the required public credit in Review rights / replacement for each covered image. Archived species and images are excluded.
