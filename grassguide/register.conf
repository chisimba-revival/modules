TEXT: mod_grassguide_publication_notice|Policy explanation|This controls app downloads, not the private editorial catalogue. Noncommercial mode retains current data and properly licensed NC images. Commercial mode excludes restricted or unclassified fields and media unless current documented commercial permission exists. Names and stable identifiers remain. Unknown or private-permission-only images require an explicit decision. Management stays administrator-only. Enable public app updates to let the free app fetch this filtered catalogue without an account. Private notes and permission evidence are never published. Disabling updates stops future downloads; it cannot recall copies already downloaded.
