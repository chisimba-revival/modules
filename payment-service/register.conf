MODULE_ID: payment-service
MODULE_ICON: credit-card
MODULE_NAME: Payment Service
MODULE_DESCRIPTION: Provider-neutral checkout, delayed-event reconciliation, fulfilment reversal and verified provider-event processing.
MODULE_AUTHORS: Chisimba Revival
MODULE_RELEASEDATE: 2026 08 25
MODULE_VERSION: 1.032
UPDATE_DESCRIPTION: Add permission-aware contextual Help to payment reconciliation.
UPDATE_DESCRIPTION: Complete the active-journey terminology audit and preserve configured role and context names.
UPDATE_DESCRIPTION: Preserve the pending registration reference from payment confirmation to email verification.
UPDATE_DESCRIPTION: Hide the legacy Paystack secret key setting after separating test and live credentials.
UPDATE_DESCRIPTION: Store separate Paystack test and live keys for safe mode switching.
UPDATE_DESCRIPTION: Add a welcoming membership landing page with course discovery after payment.
UPDATE_DESCRIPTION: Allow a pending registration to complete payment before email verification.
UPDATE_DESCRIPTION: Present membership billing periods as one radio group with a single continuation action.
UPDATE_DESCRIPTION: Offer one-month, recurring monthly and recurring annual membership choices before registration.
UPDATE_DESCRIPTION: Let visitors choose monthly or annual membership before registration and preserve the exact product through account creation.
UPDATE_DESCRIPTION: Make membership comparison public with registration-first actions for visitors.
UPDATE_DESCRIPTION: Add an editable membership comparison page with tier course discovery and upgrade journeys.
UPDATE_DESCRIPTION: Add hosted Paystack checkout, verified callbacks and recurring monthly or annual membership renewals.
UPDATE_DESCRIPTION: Replace the product selector with a confidence-building course and order review before Yoco.
MODULE_STATUS: alpha
UPDATE_DESCRIPTION: Connect private-course admission pages to a focused checkout and provide a clear post-payment course action.
UPDATE_DESCRIPTION: Add course-aware product management with server-side search, filters and pagination.
UPDATE_DESCRIPTION: Present an existing course product clearly and prevent duplicate products for one private course.
UPDATE_DESCRIPTION: Complete hosted Yoco checkout navigation and verified replay-resistant webhook processing.
