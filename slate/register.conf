TEXT: mod_slate_aboutedit|Edit a slate|Edit a slate
TEXT: mod_slate_abouteditinst|Istructions for edit/add|You can add or edit a slate by filling in the form (right). Pages should be numbered sequentially, and it is not recommended to change this.
TEXT: mod_slate_editor_denied|Editor security message|Only a signed-in administrator can edit this content.
TEXT: mod_slate_editor_method|Editor security message|Use the editor form to submit this change.
TEXT: mod_slate_editor_csrf|Editor security message|Your editing session has expired. Keep a copy of your draft, sign in again, and reopen the editor.
TEXT: mod_slate_editor_invalid|Editor security message|Check the submitted fields and try again.
TEXT: mod_slate_editor_missing|Editor security message|This item no longer exists or does not belong to this page.
TEXT: mod_slate_editor_savefailed|Editor security message|The change could not be confirmed. Your draft is still in this form. Check the saved item in another tab before retrying; the block slot or page number may already be used.
TEXT: mod_slate_help_title|Editor help|Editing Slate pages
TEXT: mod_slate_help_summary|Editor help|Only signed-in site administrators can create, edit or delete these items.
TEXT: mod_slate_help_edit|Editor help|Choose an unused positive page number, enter a title and description. A saved page keeps its original page number. Public pages offer site-scoped blocks.
TEXT: mod_slate_help_save|Editor help|Save applies the change immediately. Required fields, duplicate identifiers and stale edits are checked on the server. If another editor changed the item, copy your draft before reopening it.
TEXT: mod_slate_help_recover|Editor help|If saving fails, keep the editor open and copy your draft before signing in again. Check the saved item in another tab before retrying because a lost response does not prove the save failed.
TEXT: mod_slate_help_delete|Editor help|Delete permanently removes the selected item after confirmation. Deleting a Slate page also removes its block placements; it does not delete the underlying block content.

TEXT: mod_slate_editor_stale|Editor security message|This item has changed since you opened it. Keep a copy of your draft and reopen the saved item before applying your changes.

