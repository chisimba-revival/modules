TEXT: mod_questionworkshop_delete_confirm|Question workshop: delete_confirm|Delete this saved set permanently.
TEXT: mod_questionworkshop_delete_confirm_required|Question workshop: delete_confirm_required|Confirm that you want to delete this set, then select Delete set.

