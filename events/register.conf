TEXT: mod_events_help_editor_body|editor help body|Choose a host from the list or open New host to add their name, biography and portrait. Add host and select keeps your event draft; then choose Save to save the event. Published webinar speakers appear when Webinar is installed. In Featured image, choose a public photograph from the image chooser or paste its address. Check the preview and add a short description for people who cannot see it. Save event details to apply it to the event page and cards. The host portrait is separate. Choose a difficulty level and explain distances, terrain and age guidance below it. A site administrator can set default booking terms in Events settings; use the event override only when different terms are needed. If a field is rejected, follow the error link and correct it; your other entries are kept.

