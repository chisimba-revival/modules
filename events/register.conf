TEXT: mod_events_help_sharing_body|sharing help body|You can optionally label a shared link so each booking records where the visitor found the event. For a Facebook post, add &utm_source=facebook to the end of the public event link. For an email newsletter, use &utm_source=newsletter instead. Copy the entire link, including the added label, into your post or email. These labels are optional: the ordinary event link works without them. Use only the public event link; never share a private booking or ticket link to promote an event.

