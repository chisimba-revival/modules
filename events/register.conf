TEXT: mod_events_booking_help_choose|booking help choose|Select Choose a date to jump to Dates and booking. Open Book this date under your preferred date. Times use the timezone beside each date.
TEXT: mod_events_booking_help_details|booking help details|Enter your name, email, quantity and one attendee name per ticket. Open Booking and cancellation terms inside the form, read them, then tick the acceptance box.
TEXT: mod_events_booking_help_checkout|booking help checkout|Choose Reserve places and review total. The next page shows your total and checkout options. Complete checkout within the reservation period; confirmed payment issues your tickets and private arrival details.
TEXT: mod_events_booking_help_other|booking help other|If a date is full, open Join the waitlist and confirm your request by email. Past dates cannot be booked. Use Share event or Copy promotional text and link to tell others about the event.

