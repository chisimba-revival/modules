TEXT: mod_events_help_arrival_steps|help arrival steps|Use HTTPS and allow camera access, or enter the printed code. Confirm check-in; repeated scans report that the ticket was already used. Download the attendance list before travelling to a location with poor connectivity. Camera scanning requires a supported browser. Offline multi-device scanning is not supported; reconcile any paper attendance through the organiser after connectivity returns.
TEXT: mod_events_help_arrival_summary|help arrival summary|Organisers and assigned arrival helpers can scan tickets or enter their codes. Helpers cannot view purchaser contact details or manage payments.
TEXT: mod_events_help_arrival_title|help arrival title|Arrival and attendance
TEXT: mod_events_help_booking_steps|help booking steps|Select Choose a date to jump to Dates and booking. Open Book this date under the date you want. Enter your name, email, quantity and one attendee name per ticket. Read Booking and cancellation terms on this page and tick the acceptance box. Choose Reserve places and review total. The next page shows the total and checkout options; payment confirmation then issues your tickets. If a date is full, open Join the waitlist instead and confirm the request by email. Past dates are listed separately and cannot be booked. Exact directions and parking are provided privately with valid tickets.
TEXT: mod_events_help_booking_summary|help booking summary|Choose a date, review the public information and booking terms, and reserve the required number of places.
TEXT: mod_events_help_booking_title|help booking title|Booking an event
TEXT: mod_events_help_organising_steps|help organising steps|Save the event description, then choose Add a date to set the date, number of places, ticket price and private arrival instructions. Publish the event when it is ready for bookings. Open its public page and use Share or Copy promotional text to promote it. Only ticket holders receive the directions, parking and meeting instructions. Give arrival access only to trusted helpers. Cancelling an event stops its tickets being used, but you must arrange refunds separately through your payment provider. Your site administrator must enable scheduled reminders and waiting-list emails. Keep critical reviews visible unless there is a specific reason to hide them, and record that reason.
TEXT: mod_events_help_organising_summary|help organising summary|Administrators and users granted the events manage capability can create events. Organisers manage their own events; administrators manage all events.
TEXT: mod_events_help_organising_title|help organising title|Organising an event
TEXT: mod_events_help_tickets_steps|help tickets steps|Download the ticket or use Print to save a PDF. Add the event to your calendar. Ticket transfers invalidate the old code and link. After attendance, return to the ticket for resources and a review; publication permission is optional. If confirmation is delayed, refresh the booking or contact the organiser before paying again.
TEXT: mod_events_help_tickets_summary|help tickets summary|Your private booking link opens all tickets in your purchase. Share individual ticket links only with their attendees.
