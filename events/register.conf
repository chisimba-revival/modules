TEXT: mod_events_my_checkins|my checkins|Your ticket check-in duties
TEXT: mod_events_no_checkins|no checkins|You have no current or upcoming check-in assignments. Ask the organiser to add your account to the ticket check-in team.
TEXT: mod_events_checkins_intro|checkins intro|Open your assigned event on your phone when you arrive. Scan each ticket or find the attendee by name, then confirm their arrival.
TEXT: mod_events_team_step_assign|team step assign|Select existing site accounts below and save this date. You, as organiser, already have check-in access.
TEXT: mod_events_team_step_open|team step open|Give the team the check-in link below. Each person signs in with their own account. They can also open Events and choose Check tickets to find their assignments.
TEXT: mod_events_team_step_scan|team step scan|At the meeting point, open the event and scan the QR code on each ticket. Alternatively, enter the printed ticket code or find the attendee by name. Confirm each arrival; a repeated scan warns that the ticket was already used.
TEXT: mod_events_team_checkin_link|team checkin link|Open check-in page — share this link with your team
TEXT: mod_events_team_link_after_save|team link after save|Save this date to get the check-in link for your team.
TEXT: mod_events_change_notices_heading|change notices heading|Message about changed arrangements (optional)
TEXT: mod_events_change_notices_hint|change notices hint|Use this for a change to an existing event, such as a new meeting time. The message appears on private tickets. Save first, then use Bookings and arrival → Process booking communications and waitlist to queue a notification linking ticket holders to their updated booking. This is separate from assigning people to check tickets.
TEXT: mod_events_past_card_note|past card note|This date has finished. The event page may also list future dates.
TEXT: mod_events_checkin_window_hint|checkin window hint|Check-in is available from four hours before the start until four hours after the end. Camera scanning needs HTTPS, camera permission and a supported browser. The printed code and attendee-name list are alternatives.

