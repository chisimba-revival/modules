TEXT: mod_contactform_help_sending|Contact help_sending|Sending a contact message
TEXT: mod_contactform_help_sending_summary|Contact help_sending_summary|Enter your name, reply address, subject and message. No account is needed.
TEXT: mod_contactform_help_sending_steps|Contact help_sending_steps|Choose Send message once and wait for confirmation. Your unsent draft is retained in this browser tab when storage is available. If a connection fails, retry the same form; this prevents duplicates. A test preview does not email anyone. After reloading, use Restore unsent message. Closing the tab or clearing browser storage may remove its draft.
TEXT: mod_contactform_help_managing|Contact help_managing|Reading contact messages
TEXT: mod_contactform_help_managing_summary|Contact help_managing_summary|Contact messages are private and available only to site administrators.
TEXT: mod_contactform_help_managing_steps|Contact help_managing_steps|Use Inbox, Spam and Trash to organise messages. Select one or more messages to move them to Spam or Trash, restore them, or block their exact sender address. Unblock sender and restore reverses a block. New suspicious messages are held in Spam without email; check this folder regularly for legitimate enquiries. Check this page for spam reviews up to twenty older inbox messages; repeat on other pages as needed. Human-restored messages are not automatically moved again. Nothing is permanently deleted, and restoring does not send email. Review messages and reply using your normal mail application. Preview messages are test records. Accepted by the mail transport does not guarantee arrival in the recipient inbox. If delivery is unconfirmed or still marked as started, check the transport and mailbox before any manual resend. No automatic resend is performed. Recipient, sender and delivery mode are controlled through site configuration.

