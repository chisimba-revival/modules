TEXT: mod_spokenassessment_help_title|Spoken assessment: help_title|Spoken practice: from observation to reflection
TEXT: mod_spokenassessment_help_create|Spoken assessment: help_create|The [-author-] creates an activity with a clear prompt, learning outcomes and an optional course rubric, then publishes it. Each response keeps a snapshot of that activity.
TEXT: mod_spokenassessment_help_speak|Spoken assessment: help_speak|Read the prompt, observe your subject and explain your reasoning in your own words. Record or upload audio, listen to it, acknowledge processing and submit.
TEXT: mod_spokenassessment_help_transcript|Spoken assessment: help_transcript|Check progress. When the transcript is ready, listen and correct transcription errors. Confirming freezes the transcript for this feedback request.
TEXT: mod_spokenassessment_help_feedback|Spoken assessment: help_feedback|Read strengths and next steps. The [-author-] may add separate feedback. AI does not issue final marks and cannot assess speaking style from a transcript.
TEXT: mod_spokenassessment_help_retry|Spoken assessment: help_retry|Write a reflection and return to the activity to make another attempt. Earlier recordings and feedback remain available. Up to five responses are allowed.
TEXT: mod_spokenassessment_privacy|Spoken assessment: privacy|Privacy
TEXT: mod_spokenassessment_help_privacy|Spoken assessment: help_privacy|Only the submitting learner, teaching team for that [-context-] and site administrators may access a response. Public course visibility does not make recordings public.
TEXT: mod_spokenassessment_availability|Spoken assessment: availability|When automatic processing is unavailable
TEXT: mod_spokenassessment_help_availability|Spoken assessment: help_availability|An administrator must configure the AI services, private storage, audio validation and background worker. Human feedback remains available. Do not keep retrying unavailable services. A stalled request requires explicit recovery; it is not silently sent again.
