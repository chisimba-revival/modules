TEXT: mod_spokenassessment_feedback|Retained instructor feedback|Feedback
TEXT: mod_spokenassessment_help_heading_recording|Spoken assessment: help_heading_recording|Recording and uploading
TEXT: mod_spokenassessment_help_recording|Spoken assessment: help_recording|Allow microphone access when your browser asks. Recording requires a secure HTTPS page and browser support; uploading an existing audio file is the alternative. Keep each recording under three minutes and each file within 20 MiB. Listen before submitting. Download a copy before leaving the page if you have not successfully submitted it. Read the processing notice and acknowledge it before submitting.
TEXT: mod_spokenassessment_help_heading_corrections|Spoken assessment: help_heading_corrections|Correcting a transcript
TEXT: mod_spokenassessment_help_corrections|Spoken assessment: help_corrections|Listen to your recording and correct words the transcription misunderstood, including names and scientific terms. Keep the transcript faithful to what you said; use a new attempt for an improved answer. Check carefully before confirming: the approved transcript is then fixed for feedback. If automatic transcription is unavailable, enter a faithful transcript yourself.
TEXT: mod_spokenassessment_help_heading_recovery|Spoken assessment: help_heading_recovery|If something goes wrong
TEXT: mod_spokenassessment_help_recovery|Spoken assessment: help_recovery|If microphone access is denied, allow it in your browser settings or upload a recording instead. A failed upload keeps the selected recording available on this page: save a copy before refreshing or leaving, then correct the reported problem and try again. Use the same submission to retry an upload. Queued processing needs the background worker; check progress later. Ask the teaching team about persistent failures. A processing retry repeats the same request, whereas another attempt is a new response. Stalled processing can be explicitly retried after 15 minutes; the earlier provider request may already have incurred a charge.
TEXT: mod_spokenassessment_help_heading_privacy|Spoken assessment: help_heading_privacy|Who can see your response?
TEXT: mod_spokenassessment_help_heading_availability|Spoken assessment: help_heading_availability|When automatic feedback is unavailable
TEXT: mod_spokenassessment_help_heading_create|Spoken assessment: help_heading_create|For the teaching team: create an activity
TEXT: mod_spokenassessment_help_heading_review|Spoken assessment: help_heading_review|For the teaching team: review responses
TEXT: mod_spokenassessment_help_review|Spoken assessment: help_review|Open an activity and choose a response to listen to its audio, read the approved transcript and review feedback. Add your own feedback in the separate teaching-feedback field. You cannot approve or rewrite a learner's transcript for them. Treat AI feedback as a suggestion to review against the prompt and rubric, not a final mark. It cannot judge pronunciation, accent, pacing or presentation from a transcript.
TEXT: mod_spokenassessment_help_heading_snapshots|Spoken assessment: help_heading_snapshots|For the teaching team: changes and further attempts
TEXT: mod_spokenassessment_help_snapshots|Spoken assessment: help_snapshots|Check the [-context-] named at the top before creating or editing an activity. Save an unpublished activity while preparing it, then publish when ready. Changes to the prompt, learning outcomes or rubric apply to later submissions; existing responses retain their original activity and rubric snapshot. Learners can reflect and submit up to five responses per activity, with earlier attempts retained for comparison.
