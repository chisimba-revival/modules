TEXT: mod_shop_help_buying_title|help buying title|Buying books
TEXT: mod_shop_help_buying_summary|help buying summary|Choose books, review the delivery charge, and pay securely through Paystack. No account is required.
TEXT: mod_shop_help_buying_steps|help buying steps|Add books to your cart and adjust quantities. Delivery is calculated once for all copies using the published quantity bands. Enter a South African delivery address and accept the sales terms. Review your order, then pay through Paystack. Stock is held for 15 minutes. A return from Paystack is not proof of payment: use Check payment status if confirmation has not arrived. Keep the private order link from your confirmation email. Do not place another order if a payment is uncertain.
TEXT: mod_shop_help_managing_title|help managing title|Managing the shop
TEXT: mod_shop_help_managing_summary|help managing summary|Administrators and people granted shop management permission can maintain books and orders.
TEXT: mod_shop_help_managing_steps|help managing steps|Create a book in draft, add its public cover image, complete selling price and available stock. Publish to make it visible; archive to stop new purchases without deleting order history. Stock means physical saleable copies and decreases once when payment is confirmed. Existing orders retain their agreed details. Configure real shipping rates and terms before enabling checkout. Expired forms retain submitted values; a concurrent edit must be compared with the latest record before saving.
TEXT: mod_shop_help_shipping_title|help shipping title|Shipping costs by quantity
TEXT: mod_shop_help_shipping_summary|help shipping summary|Set decreasing total delivery charges as customers buy more copies.
TEXT: mod_shop_help_shipping_steps|help shipping steps|Start with a threshold of one book and add larger thresholds with equal or lower delivery charges. The highest applicable threshold determines the charge for the entire basket, not each book. Zero means free delivery. Blank rows are ignored; no example prices are installed. Set a maximum quantity to prevent unsupported orders. Only South Africa is enabled and there is no collection option. Rates are saved with each order so later edits do not change agreed totals.
TEXT: mod_shop_help_fulfilment_title|help fulfilment title|Packing and dispatch
TEXT: mod_shop_help_fulfilment_summary|help fulfilment summary|Payment, stock allocation and physical delivery are tracked separately.
TEXT: mod_shop_help_fulfilment_steps|help fulfilment steps|Open an order and confirm it is Paid and Awaiting packing and dispatch. Pack the books, enter the courier and tracking reference, then mark it dispatched. This queues the dispatch email once. Check payment status to reconcile with Paystack; Retry confirmation emails safely retries queueing without duplicating notices. Late payments without available stock need manual review and must not be dispatched. Handle refunds in Paystack; verified full refunds update payment status, but returned stock is never automatically made saleable. Review partial refunds in Payment Service. Keep addresses and private order links confidential.
