TEXT: mod_shop_help_sales_title|Shop help_sales_title|Preparing and running a sale
TEXT: mod_shop_help_sales_summary|Shop help_sales_summary|Shop managers can run one percentage sale at a time and place its promotion on Pages.
TEXT: mod_shop_help_sales_steps|Shop help_sales_steps|Enter a title, description, percentage from 1 to 99 and start/end times in South African time. Select books individually or use Select all. Add an optional image and button text. Save with Enable this sale unchecked to prepare; check it and save when ready. Only selected published books get the calculated sale price, rounded to cents. Regular prices and shipping costs are unchanged. Add a Sale promotion block in a page editor to show the offer there automatically. Stop sale now disables it immediately. Existing reviewed orders retain their agreed price for their 15-minute reservation; new orders use current prices. Expired forms and concurrent edits retain entered values for review. Checkout must be configured separately.

